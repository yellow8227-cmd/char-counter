<title>바로 튀어나오는 영어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 말풍선 수험표 — 위에 응시표 헤더와 과목 탭, 가운데 한 장씩 집중하는 카드. 상식·CAT 앱과 같은 잉크/OMR 빨강에 영어용 파랑 말풍선을 더함 */
:root{
  --paper:#f1f3f9; --sheet:#ffffff; --ink:#1b2440; --muted:#5b6582; --line:#d8deeb;
  --red:#dc3550; --red-soft:#fde7eb; --blue:#2f56d9; --blue-soft:#e5ebff; --mark:#ffe46b;
  --ok:#1d8556; --ok-soft:#e0f3e9; --warn:#a96800; --warn-soft:#fff2d4; --bub:#eef1f8;
  --kd:"Do Hyeon","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --en:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(27,36,64,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10141e; --sheet:#181f2e; --ink:#e7ebf5; --muted:#9aa4bf; --line:#2c3447;
  --red:#ff6b82; --red-soft:#3a1d26; --blue:#8ea8ff; --blue-soft:#1d2a4f; --mark:#6b5a12;
  --ok:#4fd197; --ok-soft:#163327; --warn:#f0b44c; --warn-soft:#3a2c12; --bub:#202a3d;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141e; --sheet:#181f2e; --ink:#e7ebf5; --muted:#9aa4bf; --line:#2c3447;
  --red:#ff6b82; --red-soft:#3a1d26; --blue:#8ea8ff; --blue-soft:#1d2a4f; --mark:#6b5a12;
  --ok:#4fd197; --ok-soft:#163327; --warn:#f0b44c; --warn-soft:#3a2c12; --bub:#202a3d;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.en{font-family:var(--en);letter-spacing:-.005em}
.muted{color:var(--muted)}
mark.hl{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 1px;border-radius:2px}

/* header */
header{display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.ticket{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.ticket span:last-child{color:var(--muted)}
.title{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--kd);font-weight:400;font-size:clamp(30px,7vw,44px);line-height:1.1}
.h1bub{font-family:var(--en);font-weight:700;font-size:15px;background:var(--blue);color:var(--sheet);border-radius:14px 14px 14px 3px;padding:4px 11px;margin-bottom:6px;white-space:nowrap}
.statline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.statline b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.sync.on{color:var(--ok);border-color:var(--ok)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.tabs button{border:0;background:var(--sheet);padding:9px 2px 8px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25}
.tabs button small{font-family:var(--en);font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tabs button[aria-pressed="true"] small{color:var(--mark)}

/* common pieces */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--kd);font-weight:400;font-size:24px;line-height:1.2}
.lbl{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.lbl.b{color:var(--blue)}.lbl.g{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:11px;padding:10px 16px;min-height:46px;text-align:center;line-height:1.3}
.btn.pri{background:var(--ink);color:var(--sheet)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13.5px;border-radius:9px}
.btn.grow{flex:1 1 140px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;min-height:38px;font-size:14px}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px;font-size:11.5px}
.chip[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700}
.chip[aria-pressed="true"] small{color:var(--red)}
.say{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;min-width:38px;height:38px;padding:0 10px;font-size:15px;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700}
.say small{font-size:11px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.meter.ok i{background:var(--ok)}.meter.red i{background:var(--red)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--muted)}
textarea,input[type=text]{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--sheet);color:var(--ink);resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--blue);outline:none}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.today{border:1.5px solid var(--ink)}
.today .big{font-family:var(--kd);font-size:44px;line-height:1}
.today .big small{font-size:18px;color:var(--muted);margin-left:4px}
.goalpick{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.goalpick button{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:2px 8px;min-height:30px;font-size:12.5px}
.goalpick button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.week{display:flex;gap:6px;align-items:flex-end;height:46px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:22px;min-height:3px;background:var(--line);border-radius:4px}
.week .hit i{background:var(--ok)}
.week .now span{color:var(--ink);font-weight:700}
.ladder{display:flex;flex-direction:column;gap:8px}
.rungs{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.rung{height:30px;border-radius:6px;background:var(--bub);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted)}
.rung.got{background:var(--blue-soft);color:var(--blue)}
.rung.cur{background:var(--blue);color:var(--sheet);box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--blue)}
.lvname{font-family:var(--en);font-weight:800;font-size:30px;line-height:1;color:var(--blue)}
.mission{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.mission{grid-template-columns:1fr}}
.mis{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:112px}
.mis:hover{border-color:var(--ink)}
.mis b{font-size:17px}
.mis span{font-size:13px;color:var(--muted)}
.mis .n{font-family:var(--kd);font-size:30px;line-height:1;color:var(--red)}
.mis.blue .n{color:var(--blue)}.mis.green .n{color:var(--ok)}
.mis .bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:auto}
.mis .bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .4s}
.mis.done{border-color:var(--ok);background:var(--ok-soft)}
.mis.done .n{color:var(--ok)}
.mis.done .bar i{background:var(--ok)}
.doneN{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.doneN.all{color:var(--ok);font-weight:600}
.weak{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.weak{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wk{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.wk:hover{border-color:var(--ink)}
.wk .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wk b{font-size:14.5px;line-height:1.35;word-break:keep-all}
.wk .pct{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.hot{border-color:var(--red);background:var(--red-soft)}
.wk.hot .pct{color:var(--red);font-weight:600}
.method{border-left:4px solid var(--blue);border-radius:0 14px 14px 0}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
@media (max-width:640px){.steps3{grid-template-columns:1fr}}
.steps3 li{background:var(--bub);border-radius:12px;padding:12px;font-size:14px;line-height:1.55}
.steps3 b{display:block;font-size:15px;margin-bottom:2px}

/* grammar */
.unitlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.unitlist{grid-template-columns:1fr}}
.utile{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.utile:hover{border-color:var(--ink)}
.utile .num{grid-row:span 3;font-family:var(--kd);font-size:34px;line-height:1;color:var(--red)}
.utile b{font-size:17px}
.utile .en{font-size:13.5px;color:var(--muted);line-height:1.45}
.utile .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--bub);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.red{background:var(--red-soft);color:var(--red)}.tag.blue{background:var(--blue-soft);color:var(--blue)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.06em}
.utitle{font-family:var(--kd);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1.15}
.bigidea{font-family:var(--en);font-size:clamp(19px,4.4vw,23px);font-weight:600;line-height:1.45;text-wrap:pretty}
.pic{background:var(--bub);border-radius:12px;padding:10px;overflow-x:auto}
.pic svg{display:block;width:100%;min-width:300px;max-width:620px;height:auto;margin:0 auto}
.pic text{font-family:var(--en);fill:var(--ink);font-size:13px}
.pic .t-m{fill:var(--muted);font-size:11.5px}
.pic .t-b{font-weight:700}
.pic .t-acc{fill:var(--blue);font-weight:700}
.pic .t-red{fill:var(--red);font-weight:700}
.sv-axis{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
.sv-now{stroke:var(--red);stroke-width:2.5;stroke-dasharray:4 4}
.sv-acc{stroke:var(--blue);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-accf{fill:var(--blue)}
.sv-soft{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.sv-inkf{fill:var(--ink)}
.sv-paper{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.sv-mark{fill:var(--mark)}
.sv-faint{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 4}
.sv-redf{fill:var(--red)}
.point{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.point:first-of-type{border-top:0;padding-top:0}
.point h3{font-family:var(--en);font-size:18px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.point h3 .pn{font-family:var(--mono);font-size:12px;color:var(--red);font-weight:500;flex:none}
.point p{margin:0;color:var(--muted);font-family:var(--en);font-size:15.5px;line-height:1.6}
.exs{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.exs li{display:flex;gap:8px;align-items:center;background:var(--bub);border-radius:10px;padding:7px 8px 7px 12px}
.exs li .en{flex:1;min-width:0;font-size:16.5px;line-height:1.5}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;display:flex;gap:6px;align-items:flex-end}
.bub .txt{font-family:var(--en);font-size:16.5px;line-height:1.5;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bub)}
.bub.B{align-self:flex-end;flex-direction:row-reverse}
.bub.B .txt{background:var(--blue-soft);border-radius:16px 16px 4px 16px}
.bub .who{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;padding-bottom:6px}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-family:var(--en);font-size:16px;line-height:1.5}
.mi .x{color:var(--red);font-weight:700}.mi .o{color:var(--ok);font-weight:700}
.mi .bad{text-decoration:line-through;text-decoration-color:var(--red);color:var(--muted)}
.mi .why{grid-column:2;font-size:14px;color:var(--muted)}
.opic{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-family:var(--en);font-size:15.5px;line-height:1.6}
.opic b{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--warn);display:block}

/* AI box */
.ai{border:1.5px dashed var(--blue);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--blue-soft) 45%,var(--sheet))}
.ai .h{display:flex;gap:8px;align-items:center;font-weight:700}
.ai .h .dot{width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--sheet);display:grid;place-items:center;font-size:12px;font-family:var(--en);font-weight:800;flex:none}
.aiout{font-family:var(--en);font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.aiout:empty{display:none}
.think{font-family:var(--en);background:var(--bub);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.6}
.think .lbl{display:block;margin-bottom:2px}
.res{display:flex;flex-direction:column;gap:10px}
.res .main{font-family:var(--en);font-size:22px;font-weight:700;line-height:1.35}
.res ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-family:var(--en)}
.res .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chunk{display:flex;gap:6px;flex-wrap:wrap}
.chunk span{background:var(--sheet);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-family:var(--en);font-size:14.5px}
.chunk span b{color:var(--blue)}
.verdict{align-self:flex-start;font-weight:800;border-radius:999px;padding:4px 12px;font-size:14px;font-family:var(--en)}
.verdict.natural{background:var(--ok-soft);color:var(--ok)}.verdict.ok{background:var(--blue-soft);color:var(--blue)}
.verdict.unnatural,.verdict.wrong-meaning{background:var(--red-soft);color:var(--red)}

/* speak */
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:640px){.deck{grid-template-columns:1fr}}
.modebtn{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.modebtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.modebtn b{font-size:16px}.modebtn span{font-size:13px;color:var(--muted);line-height:1.5}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.flash{min-height:360px;position:relative}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.prompt-ko{font-family:var(--kd);font-size:clamp(28px,7vw,40px);line-height:1.3;word-break:keep-all;text-wrap:balance;padding:10px 0}
.prompt-en{font-family:var(--en);font-size:clamp(19px,4.6vw,23px);font-weight:600;line-height:1.5}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring text{font-family:var(--mono);font-size:18px;fill:var(--ink);font-weight:600}
.answer{font-family:var(--en);font-size:clamp(24px,6vw,32px);font-weight:800;line-height:1.3;color:var(--blue);text-wrap:balance}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.vs{grid-template-columns:1fr}}
.vs div{border-radius:12px;padding:10px 12px;font-family:var(--en);font-size:15.5px;line-height:1.45}
.vs .kr{background:var(--red-soft)}.vs .kr .lbl{color:var(--red)}
.vs .kr p{text-decoration:line-through;text-decoration-color:var(--red);margin:2px 0 0}
.vs .eng{background:var(--ok-soft)}.vs .eng .lbl{color:var(--ok)}
.vs p{margin:2px 0 0;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 4px;min-height:58px;font-weight:700;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.rate button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.rate .r0{border-color:var(--red);color:var(--red)}.rate .r1{border-color:var(--warn);color:var(--warn)}.rate .r2{border-color:var(--ok);color:var(--ok)}
.reps{display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;gap:4px}
.stepper i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepper i.on{background:var(--blue)}
.para{font-family:var(--en);font-size:17px;line-height:1.75;background:var(--bub);border-radius:12px;padding:14px 16px}

{id:"u5",no:7,ko:"p.p.의 뜻",en:"What p.p. feels like",pic:"done",
 big:"A p.p. word carries one feeling: done. The action is finished, or someone or something received it.",
 points:[
  {h:"p.p. = done / received",p:"broken = someone broke it, so now it's in a broken state. closed, finished, used, lost work the same way.",
   ex:["My phone is [[broken]].","The shop is [[closed]].","I'm [[done]]!"]},
  {h:"p.p. before a noun = a description",p:"It describes the state of the thing.",
   ex:["a [[used]] car","[[frozen]] food","a [[locked]] door","I'm [[lost]]."]},
  {h:"-ed feeling vs -ing cause",p:"-ed = what you feel. -ing = what makes people feel it.",
   ex:["I'm [[bored]]. / This movie is [[boring]].","I'm [[confused]]. / The map is [[confusing]].","I was so [[embarrassed]]. / It was [[embarrassing]]."]},
  {h:"noun + p.p. = 'that was ~ed'",p:"Add a p.p. after a noun to say what was done to it.",
   ex:["a car [[made]] in Germany (= a car that was made in Germany)","the photos [[taken]] last night","a language [[spoken]] in many countries"]},
  {h:"One p.p., many frames",p:"The 'done' feeling stays the same. The frame around it changes.",
   ex:["I [[have finished]]. (done up to now)","It [[is finished]]. (it's in a finished state)","the work [[finished]] today (description)"]},
  {h:"get/have something done = someone does it for you",p:"You didn't do it yourself. Someone did it for you.",
   ex:["I [[got]] my hair [[cut]].","I [[had]] my phone [[fixed]]."]}
 ],
 dialog:[["A","Did you get a haircut?"],["B","Yeah, I [[got]] it [[cut]] yesterday. Do you like it?"],["A","Love it. You look so [[relaxed]]."],["B","I'm so [[relieved]]. My last haircut was a disaster. I was so [[embarrassed]]."],["A","Haha, that was a really [[embarrassing]] story."],["B","Don't remind me. Anyway, I'm [[done]] with that salon."]],
 mistakes:[
  ["I'm boring.","I'm bored.","'I'm boring' means you make other people bored!"],
  ["I cut my hair at a salon.","I got my hair cut at a salon.","Unless you cut it yourself."],
  ["a car making in Korea","a car made in Korea","The car received the action → p.p."],
  ["I'm so exciting about the trip.","I'm so excited about the trip.","You feel it → -ed."]
 ],
 opic:"Feeling words make your stories vivid: 'I was so surprised.' 'It was a little disappointing.' 'I felt really relieved.'"
},
{id:"u6",no:8,ko:"would 다시 보기",en:"The feeling of would",pic:"would",
 big:"would = will, but one step away: away from reality (imagining), away in time (the past), or a polite step back.",
 points:[
  {h:"Imagining (not real now)",p:"Use it for situations that aren't true right now. After 'if', use the past form.",
   ex:["I[['d travel]] more if I [[had]] more time.","If I were you, I[['d take]] the job.","I [[would never]] do that."]},
  {h:"Polite and soft",p:"would sounds gentler than will or want.",
   ex:["[[Would]] you like some coffee?","I[['d like]] a latte, please.","[[Would]] you mind closing the window?","That [[would be]] great."]},
  {h:"I'd love to / I'd rather",p:"I'd love to = yes, happily. I'd rather = I prefer to.",
   ex:["I[['d love to]] come!","I[['d rather]] stay home tonight."]},
  {h:"Past habits (repeated actions)",p:"For things you did again and again in the past. For past states (be, have, live, like), use 'used to'.",
   ex:["When I was a kid, I [[would]] play outside until dark.","I [[used to]] have long hair. (✗ I would have long hair)"]},
  {h:"will, seen from the past",p:"When you report what someone said or thought before.",
   ex:["He said he[['d call]] me. (He said, 'I'll call you.')","I knew you[['d like]] it."]},
  {h:"would have p.p. = imagining the past",p:"It didn't happen. You're imagining another past.",
   ex:["I [[would have come]] if you'd told me. (I didn't come.)","That [[would have been]] fun."]},
  {h:"wouldn't = refused",p:"Something or someone refused to work or act.",
   ex:["My car [[wouldn't]] start this morning.","The kid [[wouldn't]] stop crying."]}
 ],
 dialog:[["A","[[Would]] you like to grab dinner on Friday?"],["B","I[['d love to]]! Where [[would]] you want to go?"],["A","How about that Thai place? I think you[['d like]] it."],["B","Perfect. When I lived in Bangkok, I [[would]] eat pad thai every day."],["A","Then this [[would be]] a good test, haha."],["B","Honestly, if I had time, I[['d move]] back there."]],
 mistakes:[
  ["If I have money, I would buy a house.","If I had money, I would buy a house.","Imagining → past form after if (had), would in the other part."],
  ["I would like go.","I'd like to go.","would like + to + verb."],
  ["When I was young, I would be shy.","I used to be shy.","A past state → used to."],
  ["If I would know, I would tell you.","If I knew, I would tell you.","No would after if (in imagining)."]
 ],
 opic:"Role-play questions: 'Would it be possible to…?', 'Would you mind…?'. Imagining questions: 'If you could…, what would you do?' → 'I would…'."
},
{id:"u7",no:9,ko:"문장의 절 구조",en:"Building with clauses",pic:"blocks",
 big:"A clause is one 'someone + does/is something' unit. A long sentence is just small clauses connected. Say one, then add the next.",
 points:[
  {h:"One clause = subject + verb",p:"Count the subject-verb pairs.",
   ex:["[[I was]] tired. (1)","[[I was]] tired, so [[I went]] home early. (2)"]},
  {h:"Add a reason, a time, or a condition",p:"because, when, if, before, after, while, although, until, as soon as. Talking about the future after when/if? Use the present.",
   ex:["I stayed home [[because it was raining]].","[[When I get home]], I usually take a shower.","[[If it's sunny tomorrow]], let's go hiking. (✗ If it will be)"]},
  {h:"A clause can be a 'thing'",p:"that / what / if + clause works like one big noun.",
   ex:["I think [[(that) he's right]].","I don't know [[what he wants]].","I'm not sure [[if it's open]].","[[What I need]] is a break."]},
  {h:"Question inside a sentence = normal order",p:"Once a question goes inside a sentence, it becomes subject + verb again.",
   ex:["Where is the station? → Do you know [[where the station is]]?","What time does it start? → Can you tell me [[what time it starts]]?"]},
  {h:"A clause can describe a noun",p:"This is the relative clause (see unit 8).",
   ex:["the guy [[who lives next door]]","the place [[where we met]]"]},
  {h:"How natives build long answers",p:"Main idea first. Then add: because…, so…, which…, but…, and then…",
   ex:["I love my neighborhood [[because it's quiet]], [[which is rare in Seoul]]."]}
 ],
 dialog:[["A","Do you know [[what time the store closes]]?"],["B","I'm not sure, but I think [[it closes at nine]]."],["A","[[If it's still open when we get there]], let's buy some snacks."],["B","Okay. [[Although I already ate]], I could eat again."],["A","Ha. [[What I really want]] is ice cream."],["B","Same. I'll text my sister to ask [[if she wants some]]."]],
 mistakes:[
  ["Do you know where is the bathroom?","Do you know where the bathroom is?","Inside a sentence → normal order."],
  ["When I will finish work, I'll call you.","When I finish work, I'll call you.","Future after when / if → present."],
  ["Although it was raining, but we went out.","Although it was raining, we went out.","Use one connector, not two."],
  ["I don't know what does he want.","I don't know what he wants.","No 'does' inside the sentence."]
 ],
 opic:"OPIc raters listen for connected speech (paragraphs = IH/AL). Practice: one clause → add because → add so → add which."
},
{id:"u8",no:10,ko:"관계사",en:"Name tags for nouns",pic:"tag",
 big:"A relative clause is a name tag on a noun. It tells you WHICH one, or adds extra information about it.",
 points:[
  {h:"who / that → people",p:"The clause tells you which person.",
   ex:["I have a friend [[who lives in Canada]].","The woman [[that helped me]] was so kind."]},
  {h:"which / that → things",p:"The clause tells you which thing.",
   ex:["The phone [[that I bought last week]] is already broken.","It's a song [[that always makes me cry]]."]},
  {h:"Drop it when a new subject follows",p:"If the next word is a new subject (I, you, he…), you can drop who/that. Natives usually do.",
   ex:["the movie [[(that) I watched]] yesterday","the person [[(who) I talked to]]","Everything [[I said]] was true."]},
  {h:"where / when → places and times",p:"For places use where. For times, natives often just drop when.",
   ex:["the café [[where we first met]]","the day [[(when) I got my license]]"]},
  {h:"whose = his / her / their",p:"Shows that something belongs to that person.",
   ex:["I have a friend [[whose dad is a pilot]]."]},
  {h:"what = the thing(s) that",p:"what already contains the noun. Don't say 'the thing what'.",
   ex:["[[What I want]] is some sleep.","That's not [[what I meant]].","Do [[what you love]]."]},
  {h:", which… = your comment on the whole sentence",p:"Super common in speech for adding your reaction at the end.",
   ex:["He didn't show up, [[which was really annoying]].","We got a free upgrade, [[which was nice]]."]},
  {h:"Preposition at the end (casual)",p:"In speech, the little word goes to the end.",
   ex:["the person [[I live with]]","the city [[I grew up in]]","something [[I'm interested in]]"]}
 ],
 dialog:[["A","Who's the guy [[you were talking to]]?"],["B","That's Minho. He's the friend [[I told you about]], the one [[who works at the airport]]."],["A","The one [[whose sister is a singer]]?"],["B","Yes! And the café [[where we were sitting]] is his. He just opened it, [[which is amazing]]."],["A","Is that [[what he always wanted to do]]?"],["B","Exactly. It's something [[he's been dreaming about]] for years."]],
 mistakes:[
  ["I have a friend who she lives in Canada.","I have a friend who lives in Canada.","'who' already takes the place of 'she'."],
  ["the thing what I want","the thing (that) I want / what I want","'what' already includes 'the thing'."],
  ["the city where I grew up in","the city where I grew up / the city I grew up in","where already includes 'in'."],
  ["He was late, that was annoying.","He was late, which was annoying.","Commenting on a whole sentence → , which"]
 ],
 opic:"Describing places and people: 'It's a small café that has big windows, which makes it really bright.'"
},
{id:"u10",no:11,ko:"-ed의 두 얼굴",en:"Did it, or had it done to you",pic:"faces",
 big:"The same -ed word has two completely different jobs. Alone, it means the subject DID it. With was/were/is in front, it means the subject RECEIVED it. The little word in front is the only signal.",
 points:[
  {h:"Face 1 — -ed alone = the subject did it",p:"No helper word in front. The subject is the one acting. This is just the simple past.",
   ex:["I [[closed]] the door.","He [[broke]] my cup.","She [[finished]] the report."]},
  {h:"Face 2 — was/were + -ed = the subject received it",p:"Same -ed word. But now the subject is not acting. Something happened TO it.",
   ex:["The door [[was closed]]. (someone closed it)","My cup [[was broken]]. (someone broke it)","The report [[was finished]]. (someone finished it)"]},
  {h:"So: look at the word in FRONT, not the -ed",p:"The -ed tells you nothing by itself. Train your eyes to check what sits before it. Three possible fronts, three meanings.",
   ex:["[[nothing]] + closed → I closed it. (I did it)","[[was / is / were]] + closed → It was closed. (it got closed)","[[have / has / had]] + closed → I have closed it. (done, and it still counts now)"]},
  {h:"Feelings are almost always Face 2",p:"This is the number one Korean-speaker mistake. Things interest YOU, bore YOU, tire YOU. So you are the receiver. You always need be + p.p.",
   ex:["I [[was interested]] in it. (✗ I interested)","I[['m bored]]. (✗ I bore)","I [[was surprised]].","I[['m tired]].","I[['m worried]] about it."]},
  {h:"A few verbs can stand on both sides",p:"open, close, break, change, start, stop, move. With no object after them, they look like they moved by themselves. With was, someone did it.",
   ex:["The door [[opened]]. (it just opened — maybe wind)","The door [[was opened]]. (a person opened it)","The glass [[broke]]. (it fell and broke)","The glass [[was broken]]. (someone broke it)"]},
  {h:"Some verbs can NEVER take Face 2",p:"happen, occur, appear, arrive, die, go, come, fall. Nobody does these to you, so was + p.p. is impossible. Koreans say 'was happened' all the time — never say it.",
   ex:["It [[happened]] last night. (✗ It was happened)","He [[arrived]] late. (✗ He was arrived)","My grandfather [[died]] in 2019. (✗ was died)"]},
  {h:"Line the three frames up and say them out loud",p:"Take one verb and run it through all three. Do this with five verbs and the confusion disappears.",
   ex:["I [[finished]] it. — I did it, back then","It [[is finished]]. — it is in a finished state now","I[['ve finished]] it. — I did it, and it still counts","It [[was finished]] yesterday. — someone finished it then"]}
 ],
 dialog:[["A","What happened to your phone?"],["B","The screen [[was cracked]] when I got it back from repair."],["A","Wait, so they [[cracked]] it?"],["B","Probably. It [[wasn't broken]] when I [[dropped]] it off."],["A","Weren't you [[annoyed]]?"],["B","I [[was]]. But they [[fixed]] it for free, so I[['m satisfied]] now."]],
 mistakes:[
  ["I interested in movies.","I'm interested in movies.","Movies interest you → you are the receiver → be + p.p. Never drop the be."],
  ["It was happened yesterday.","It happened yesterday.","Nobody does 'happen' to it. happen can never take was + p.p."],
  ["The window broke by my brother.","The window was broken by my brother.","Once you name who did it (by ~), you need the passive: was + p.p."],
  ["I was finished my homework.","I finished my homework.","You did it → no was. 'I was finished' would mean someone finished YOU."],
  ["My bike stole last night.","My bike was stolen last night.","The bike did not steal anything. It received the action → was + p.p."]
 ],
 opic:"When something bad happens to your things, this is the whole grammar: 'My wallet was stolen', 'The road was blocked', 'I was told to wait.' Practice those three shapes."
}
];

Q("u0","pick","What is the p.p. of \"be\"?\nI have ___ sick all week.",["been","was","am","being"],"be-was-been. After have you need the p.p., and be's p.p. is been."),
Q("u0","mean","I have lost my wallet.",["I lost it, and it is still missing now.","I lost it, but I already found it.","I am going to lose it.","Someone lost my wallet for me."],"have + p.p. = you are holding the finished thing now. So the wallet is still gone."),
Q("u0","mean","I lost my wallet.",["It happened back then. Maybe I found it later, maybe not.","It is definitely still missing.","I am losing it right now.","I never had a wallet."],"Simple past only reports a past event. It says nothing about now."),
Q("u0","pick","I ___ English for two hours. I need a break.",["'ve been studying","have studying","am been studying","have study"],"have + been + -ing. You cannot jump from have straight to -ing."),
Q("u0","fix","Which one sounds natural?",["I have seen that movie.","I have saw that movie.","I have see that movie.","I am seen that movie."],"have + p.p. (see-saw-seen)."),
Q("u0","mean","He has gone to Japan.",["He is not here right now.","He is here, talking about Japan.","He went to Japan and came back.","He will go to Japan soon."],"has gone = he left and is still away. have been to = went and came back."),
Q("u0","pick","Only the front changes. I am studying → I ___ studying (up to now).",["have been","am been","was been","have"],"am → have been. The -ing stays exactly where it is."),
Q("u0","fix","Which one sounds natural?",["I've been to Japan twice.","I've went to Japan twice.","I have be to Japan twice.","I am been to Japan twice."],"have been to = visited and came back."),

Q("u9","pick","When I got to the station, the train ___.",["had already left","already left","has already left","was already leaving"],"It left before you arrived → one step further back → had p.p."),
Q("u9","mean","By the time I got home, they had eaten everything.",["They finished eating before I arrived.","They ate after I came home.","We ate together.","They were still eating when I walked in."],"had p.p. = already finished before that past moment."),
Q("u9","pick","He said he ___ the report.",["had finished","has finished","have finished","finish"],"Reporting someone's past sentence → one step back → had p.p."),
Q("u9","fix","Which one sounds natural?",["I had gone home early that day.","I had went home early that day.","I had go home early that day.","I have went home early that day."],"had + p.p. (gone), not went."),
Q("u9","pick","If I ___ known, I would have come.",["had","have","would have","did"],"After if, imagining a past that did not happen → had p.p."),
Q("u9","mean","I'd been waiting for an hour when she showed up.",["The waiting went on until she arrived.","I waited only after she arrived.","I waited an hour yesterday, that is all.","She waited for me."],"had been -ing = it had been going on up to that past moment."),
Q("u9","pick","Yesterday I ___ lunch at noon.",["ate","had eaten","have eaten","had ate"],"Just one past event with no second past moment → simple past."),
Q("u9","fix","Which one sounds natural?",["After I finished work, I went home.","After I had finished work, I had gone home.","After I finish work, I had went home.","After I had finish work, I went home."],"'After' already shows the order, so simple past is enough and sounds natural."),

/* ── 헷갈리는 짝 · 까다로운 문제 ── */
Q("u0","mean","She has been to Paris. / She has gone to Paris.",["First: she visited and came back. Second: she is there now.","Both mean she is in Paris.","Both mean she came back.","First: she lives there. Second: she visited once."],"been to = went and returned. gone to = left and is still away."),
Q("u0","pick","Irregular check: I have ___ my keys again. (lose)",["lost","losed","lose","losing"],"lose-lost-lost. The p.p. is lost."),
Q("u0","fix","Which one is correct?",["I've had this car for three years.","I've have this car for three years.","I've having this car for three years.","I have had this car since three years."],"have-had-had. The first 'have' is the machine, the second 'had' is the p.p. of 'own'."),
Q("u0","mean","He's been quiet. / He's being quiet.",["First: quiet for a while up to now. Second: acting quiet right now, unlike usual.",'Both mean he is always quiet.',"First: he acts quiet. Second: he was quiet before.","Both describe his personality."],"have been = up to now. be being = acting that way at this moment."),
Q("u0","pick","Which sentence needs 'been'? I have ___ working all day.",["been","be","was","am"],"have + be + -ing → be becomes been. have been working."),
Q("u0","fix","Which one sounds natural?",["It's been a long day.","It has being a long day.","It is been a long day.","It been a long day."],"It has been = It's been. 'be' becomes 'been' after has."),

Q("u1","mean","I have a car. / I'm having a car.",["First is correct. 'Have' as 'own' is a state, so no -ing.","Both are fine.","Second is more polite.","Second means I am buying one."],"have = own → a state. But 'have lunch / have fun' are actions and can take -ing."),
Q("u1","pick","This soup ___ amazing. You have to try it.",["tastes","is tasting","taste","has tasted"],"taste as a sense = a state → simple present."),
Q("u1","mean","You're always leaving your dishes in the sink.",["It happens too often and it annoys me.","You leave dishes only sometimes.","You left dishes once.","You will leave dishes."],"always + -ing = a complaint, not a neutral habit."),
Q("u1","fix","Which one sounds natural?",["I see what you mean.","I'm seeing what you mean.","I am see what you mean.","I seeing what you mean."],"see = understand → a state. (But 'I'm seeing someone' = dating, an action.)"),
Q("u1","pick","A: Where's Mom?\nB: She ___ the car. She'll be back soon.",["'s washing","washes","washed","has washed"],"In progress right now → -ing."),
Q("u1","mean","What do you do? / What are you doing?",["First asks about your job. Second asks about this moment.","Both ask about your job.","First asks about now. Second asks about your job.","Both ask about your plans."],"The most common confusion for Korean learners."),

Q("u2","pick","Careful: I ___ my phone yesterday, and I still haven't found it.",["lost","'ve lost","have been losing","lose"],"'yesterday' is a finished time, so the first verb is simple past. The second clause then uses have p.p."),
Q("u2","fix","Which one sounds natural?",["Have you ever been to Jeju?","Have you ever gone to Jeju?","Did you ever been to Jeju?","Have you ever went to Jeju?"],"For life experience, the set phrase is have been to."),
Q("u2","mean","I've worked here for three years. / I worked here for three years.",["First: I still work here. Second: I don't anymore.","Both mean I still work here.","Both mean I quit.","First: I quit. Second: I still work here."],"The line reaching now is the whole difference."),
Q("u2","pick","We've known each other ___ we were in middle school.",["since","for","from","during"],"since + a starting point. A whole clause can be the starting point."),
Q("u2","fix","Which one is wrong?",["I've met him last week.","I met him last week.","I've met him before.","I've already met him."],"A finished time word (last week, yesterday, in 2020) cannot sit with have p.p."),
Q("u2","pick","A: Is Minji still at the office?\nB: No, she ___ home.",["has gone","has been","went to","has been to"],"has gone home = she left and is not here now."),

Q("u3","mean","I've read that book. / I've been reading that book.",["First: I finished it. Second: I'm still in the middle.","Both mean I finished it.","Both mean I started it.","First: I started it. Second: I finished it."],"have p.p. = the finished result. have been -ing = the activity, maybe unfinished."),
Q("u3","pick","How many emails ___ today?",["have you written","have you been writing","did you wrote","are you written"],"A number of finished things → have p.p., not -ing."),
Q("u3","fix","Which one sounds natural?",["I've been having trouble sleeping.","I've been knowing him for years.","I've been owning this car since 2020.","I've been believing you."],"know, own, believe are states. But 'have trouble' means 'experience', which is an action, so -ing is fine."),
Q("u3","mean","Your hands are dirty. Have you been gardening?",["I see a result now, so I guess you were gardening until just now.","Do you garden as a hobby?","Will you garden later?","Did you garden last year?"],"have been -ing + visible evidence right now."),
Q("u3","pick","It ___ for three days. The roads are flooded.",["'s been raining","rains","rained","is rain"],"Started three days ago, still going, and there is a result now."),

Q("u9","mean","When I arrived, she left. / When I arrived, she had left.",["First: she left after I got there. Second: she was already gone.","Both mean she was already gone.","Both mean she left after I arrived.","First: she was gone. Second: she left later."],"had p.p. moves the event before the other past moment."),
Q("u9","pick","I couldn't get in because I ___ my key at home.",["had left","have left","left had","was leaving"],"Leaving the key happened before 'couldn't get in' → had p.p."),
Q("u9","fix","Which one sounds natural?",["I'd never seen anything like it.","I never had seen anything like it.","I'd never saw anything like it.","I never have saw anything like it."],"had + never + p.p. (seen)."),
Q("u9","mean","If I had studied harder, I would have passed.",["I didn't study hard, and I didn't pass.","I studied hard and passed.","I will study hard and pass.","I'm studying hard now."],"if + had p.p. = imagining a past that did not happen."),
Q("u9","pick","She told me she ___ the movie three times.",["had seen","has seen","have seen","did see"],"Reporting a past sentence → one step back."),
Q("u9","fix","Which one sounds natural?",["I got up, had breakfast, and went to work.","I had got up, had had breakfast, and had gone to work.","I had get up, had breakfast, and went to work.","I got up, had had breakfast, and had went to work."],"Events told in order need no had p.p. Overusing it sounds unnatural."),

Q("u4","mean","My bike was stolen. / My bike got stolen.",["Almost the same. 'got' sounds more casual and sudden.","First is casual, second is formal.","First means I stole it.","Second means the bike stole something."],"get + p.p. is the spoken version of be + p.p."),

Q("u4","mean","I'm supposed to be there at seven.",["Someone expects me to be there at seven.","I want to be there at seven.","I was there at seven.","I will probably be late."],"be supposed to = it's the plan or the rule."),

Q("u5","mean","I'm bored. / I'm boring.",["First: I feel bored. Second: I make other people bored.","Both mean I feel bored.","Both mean I am a fun person.","First: I make others bored. Second: I feel bored."],"-ed = your feeling. -ing = the effect you have on others."),

Q("u5","fix","Which one sounds natural?",["I was shocked by the news.","I was shocking by the news.","I shocked by the news.","I am shock by the news."],"You received the shock → -ed."),
Q("u5","pick","This is a dish ___ with rice and vegetables.",["made","making","makes","is made"],"noun + p.p. = a dish that is made with…"),

Q("u6","fix","Which one is wrong?",["I would be shy when I was a kid.","I used to be shy when I was a kid.","I would cry a lot when I was a kid.","I used to cry a lot when I was a kid."],"would doesn't work for past states (be, have, like, live). Use used to."),
Q("u6","pick","If I ___ you, I wouldn't say anything.",["were","am","was being","will be"],"'If I were you' is the fixed advice phrase."),

Q("u1","pick","Water ___ at 100 degrees.",["boils","is boiling","boiled","has boiled"],"A general fact → simple present."),

Q("u1","pick","I ___ my grandmother every Sunday.",["call","am calling","called","have called"],"every Sunday = a routine → simple present."),
Q("u1","pick","I can't talk now. I ___ my grandmother.",["'m calling","call","called","have called"],"Happening at this moment → -ing."),

Q("u2","pick","I ___ this laptop for four years.",["have had","had","have","am having"],"for + still true now → have + p.p. of have, which is had."),
Q("u2","pick","I ___ my old laptop four years ago.",["bought","have bought","had bought","buy"],"ago = a finished time → simple past."),
Q("u2","pick","We ___ friends since 2015.",["have been","were","are","had been"],"since + still true → have been."),
Q("u2","pick","We ___ in the same class in 2015.",["were","have been","had been","are"],"in 2015 = a finished year → were."),
Q("u2","pick","A: Is Tom here?\nB: No, he ___ yet.",["hasn't arrived","didn't arrive","hadn't arrived","doesn't arrive"],"not … yet = nothing has happened up to now → have p.p."),

Q("u2","pick","He ___ here since March.",["has worked","worked","works","had worked"],"since March + still here → has worked."),
Q("u2","pick","He ___ here from 2019 to 2021.",["worked","has worked","has been working","had worked"],"from … to … closes the time → simple past."),
Q("u2","pick","I ___ my wallet! I can't pay.",["have lost","lost","had lost","was losing"],"It is still gone right now → have p.p."),
Q("u2","pick","I ___ my wallet last year, but someone found it.",["lost","have lost","had lost","was lost"],"last year = finished, and the problem is over → simple past."),

Q("u3","pick","I ___ emails all morning. I'm exhausted.",["have been writing","have written","wrote","write"],"The activity itself, up to now, with a result I can feel → have been -ing."),

Q("u3","pick","She ___ that book twice.",["has read","has been reading","is reading","reads"],"twice = a count of finished readings → have p.p."),
Q("u3","pick","She ___ that book for a month. She's on page 50.",["has been reading","has read","reads","read"],"Still in the middle → have been -ing."),
Q("u3","pick","Your face is red. Have you ___ running?",["been","be","being","was"],"have + been + -ing. been is be's p.p."),
Q("u3","pick","I ___ her for ten years.",["have known","have been knowing","am knowing","know"],"know is a state, so it cannot take -ing."),

Q("u9","pick","When I got there, the shop ___ already closed.",["had","has","was","have"],"It closed before I got there → one step further back → had p.p."),
Q("u9","pick","Yesterday I was late because I ___ the bus.",["had missed","have missed","miss","am missing"],"Missing the bus happened before 'was late' → had p.p."),
Q("u9","pick","She said she ___ never been to Korea.",["had","has","have","was"],"Reporting a past sentence → one step back."),
Q("u9","pick","I ___ waiting for an hour when she finally arrived.",["had been","have been","was been","am"],"The waiting went on up to that past moment → had been -ing."),
Q("u9","pick","By the time we arrived, the game ___.",["had ended","has ended","ended","was ending"],"By the time + past → the other thing was already finished."),
Q("u9","pick","I ___ dinner and then watched TV.",["ate","had eaten","have eaten","had ate"],"Events told in order need no had p.p."),
Q("u9","pick","He ___ his keys, so he couldn't open the door.",["had lost","has lost","loses","was losing"],"Losing them came before 'couldn't open' → had p.p."),

Q("u6","pick","If I ___ more time, I would travel more.",["had","have","will have","would have"],"Imagining now → past form after if, would in the other half."),
Q("u6","pick","If I ___ earlier, I would have caught the train.",["had left","left","have left","would leave"],"Imagining a past that did not happen → if + had p.p."),
Q("u6","pick","I ___ have called you, but my phone died.",["would","will","am going to","did"],"would have p.p. = it did not happen."),
Q("u6","pick","If it ___ tomorrow, we'll stay home.",["rains","will rain","rained","would rain"],"A real possibility → present after if, will in the other half."),

Q("u6","pick","I wish I ___ more sleep last night.",["had gotten","got","have gotten","would get"],"Wishing about a past that did not happen → had p.p."),

Q("u7","pick","Call me when you ___ home.",["get","will get","would get","are getting"],"Future after when → present."),
Q("u7","pick","I'll wait here until she ___.",["comes","will come","came","would come"],"Future after until → present."),
Q("u7","pick","As soon as I ___ the email, I'll let you know.",["get","will get","got","am getting"],"Future after as soon as → present."),
Q("u7","pick","I don't know if he ___ tomorrow.",["will come","comes","came","would come"],"Here if means whether, so will is correct. This is the opposite of the next one."),
Q("u7","pick","If he ___ tomorrow, I'll be surprised.",["comes","will come","came","would come"],"Here if sets a condition, so use the present. Compare with the whether sentence."),
Q("u7","pick","Before I ___ to bed, I always read for a while.",["go","will go","went","am going"],"A routine with before → simple present."),

Q("u4","pick","The bridge ___ in 1995.",["was built","is built","has built","had built"],"The bridge received the action, and 1995 is finished → was + p.p."),
Q("u4","pick","Sorry, my car ___ right now.",["is being fixed","is fixing","fixes","was fixed"],"In progress now and the car receives it → is being + p.p."),
Q("u4","pick","The meeting ___ to Friday. Check your email.",["has been moved","has moved","is moving","moved"],"Someone moved it and the result matters now → has been + p.p."),
Q("u4","pick","Dinner ___ by the time we got home.",["had been cooked","has been cooked","was cooking","is cooked"],"Finished before that past moment, and dinner receives the action → had been + p.p."),

Q("u10","pick","I ___ the door before I left.",["locked","was locked","am locked","been locked"],"I did it → -ed alone. 'I was locked' would mean someone locked ME in."),
Q("u10","pick","When I came back, the door ___.",["was locked","locked","has locked","did lock"],"The door did not lock anything. It received the action → was + p.p."),
Q("u10","pick","I ___ in Korean history.",["'m interested","interest","interested","am interesting"],"History interests YOU. You are the receiver → be + interested. 'I'm interesting' means other people find ME interesting."),
Q("u10","pick","The movie ___. I almost fell asleep.",["was boring","was bored","bored me boring","is bored"],"The movie DOES the boring → -ing. You would be the one who is bored."),
Q("u10","pick","A: How was the show?\nB: Honestly, I ___.",["was bored","was boring","bored","am boring"],"You received the boredom → be + bored. 'I was boring' means you bored everyone else."),
Q("u10","pick","It ___ around midnight. Nobody saw it.",["happened","was happened","has happened by","was happening to"],"happen can never take was + p.p. Nobody does 'happen' to something."),
Q("u10","pick","My wallet ___ on the subway.",["was stolen","stole","has stolen","was stealing"],"The wallet received the action → was + p.p. This exact sentence comes up constantly."),
Q("u10","pick","He ___ at the station ten minutes late.",["arrived","was arrived","is arrived","had arrived by"],"arrive has no receiver → never was + p.p."),
Q("u10","mean","I was finished.",["Someone or something finished me — I had nothing left.","I completed my work."],"'I finished' = I did it. 'I was finished' puts YOU in the receiver seat. Careful with this one."),
Q("u10","pick","The glass ___ when I dropped it.",["broke","was broken","is broken","has broken"],"It fell and broke by itself → -ed alone. 'was broken' would suggest a person broke it."),
Q("u10","pick","The window ___ by my little brother.",["was broken","broke","breaks","has broke"],"Once you name the doer with by ~, the passive is required."),
Q("u10","pick","Don't sit there — the paint ___ yet.",["hasn't dried","isn't dried","wasn't dried","didn't dried"],"Paint dries by itself → dry is Face 1. Up to now → have p.p."),
Q("u10","pick","I ___ to wait outside.",["was told","told","have told","am telling"],"Someone told you → you are the receiver. be told is one of the most useful passives in speech."),
Q("u10","pick","She ___ me the whole story.",["told","was told","is told","been told"],"Here SHE is doing the telling → -ed alone."),
Q("u10","mean","My grandfather died in 2019.",["He passed away in 2019.","Someone killed him in 2019."],"die never takes was + p.p. 'was died' does not exist in English."),
Q("u10","pick","The road ___ because of the snow.",["was blocked","blocked","blocks","has blocked"],"The road received it → was + p.p."),
Q("u10","pick","A: Why are you so quiet?\nB: I ___ about the interview.",["'m worried","worry","worried","'m worrying it"],"Something worries you → be + worried. This is a feeling, so Face 2."),
Q("u10","pick","The meeting ___ at three and ___ at five.",["started … ended","was started … was ended","started … was ended","was starting … ended"],"Meetings start and end by themselves in normal speech. Adding was here sounds unnatural."),
Q("u10","pick","This photo ___ in 1998.",["was taken","took","has taken","was taking"],"The photo received the taking → was + p.p. take-took-taken."),
Q("u10","pick","I ___ so many photos that day.",["took","was taken","have taken by","was taking by"],"You did it → -ed alone (took)."),
Q("u10","mean","I'm confused.",["I don't understand — something confused me.","I am making other people confused."],"-ed = how you feel. -ing = the effect you have on others. 'I'm confusing' means other people can't follow you."),
Q("u10","pick","The rule ___ last year, so it's different now.",["was changed","changed it","has change","was changing"],"Someone changed it → passive. (The rule changed. is also fine, but with a doer in mind the passive is clearer.)"),
Q("u10","pick","Nothing much ___ last weekend.",["happened","was happened","has happened to be","were happened"],"happen is Face 1 only. Say this one out loud three times."),
Q("u10","pick","A: Did you fix it yourself?\nB: No, it ___ at the shop.",["was fixed","fixed","has fixed","was fixing"],"You did not do it → the thing received it → was + p.p."),
Q("u10","pick","I ___ the email, but I haven't sent it yet.",["wrote","was written","have been written","was writing it"],"You did the writing → -ed alone."),
Q("u10","pick","The email ___ to the wrong person.",["was sent","sent","sends","has sent"],"The email received it → was + p.p."),
Q("u10","pick","I ___ really tired after work yesterday.",["was","was been","had been being","am"],"tired is already a p.p. acting like an adjective. You only need was in front — nothing else."),
Q("u10","mean","The store was closed.",["It wasn't open — the doors were shut.","Someone shut the store down forever."],"Here closed describes a state. Context decides whether it is 'not open' or 'someone closed it' — both readings use the same shape.")

SC("h03","home","u1","나는 보통 7시에 일어나.","I usually get up at seven.","get up = leave your bed. usually = most days. It's a routine, so simple present.",{trap:"I am usually wake up at 7."}),

SC("o01","opic","u1","저는 IT 회사에 다녀요.","I work at an IT company.","work at + a company. Simple present = your normal life.",{alt:"I'm currently working at an IT company."}),
SC("o02","opic","u1","가족이랑 아파트에 살아요.","I live in an apartment with my family.","Simple present = a fact about your life."),
SC("o03","opic","u2","거기 산 지 꽤 됐어요.","I've lived there for quite a while.","for quite a while = for a fairly long time, until now."),
SC("o04","opic","u3","요즘 운동에 빠져 있어요.","I've been really into working out lately.","be into = really like. have been + lately = it's been going on recently.",{trap:"Recently I'm falling into exercise."}),
SC("o05","opic","u6","어렸을 땐 매일 밖에서 놀곤 했어요.","When I was a kid, I would play outside every day.","would + a past time = a repeated habit."),
SC("o06","opic","u6","예전엔 머리가 길었어요.","I used to have long hair.","used to = it was true in the past, not now. For states, not would."),
SC("o07","opic","u7","그래서 제가 그 공원을 좋아해요.","That's why I love that park.","That's why… = a great way to finish an answer."),
SC("o08","opic",null,"솔직히 잘 기억이 안 나요.","To be honest, I don't really remember.","To be honest = I'm telling you the truth. A natural way to buy time."),
SC("o09","opic","u8","절대 못 잊을 일이 하나 있어요.","There's one thing I'll never forget.","the name tag 'I'll never forget' describes 'one thing'.",{alt:"One thing really stands out."}),
SC("o10","opic","u6","시간이 더 있다면 여행을 더 할 거예요.","If I had more time, I would travel more.","Imagining → had + would."),
SC("o11","opic","u4","그 공연 비 때문에 취소됐어요.","The concert got canceled because of the rain.","The concert received the action → got canceled."),
SC("o12","opic","u6","질문 몇 개 드려도 될까요?","Would it be okay if I asked you a few questions?","Would it be okay if I + past = very polite. Good for OPIc role-plays.",{alt:"Can I ask you a few questions?"}),
SC("o13","opic",null,"음, 뭐라고 해야 하지…","Hmm, how should I put it…","A filler to buy time. 'put' here means say or express. Much better than silence!",{alt:"Let me think…"}),
SC("o14","opic","u7","제가 이 동네를 좋아하는 이유는 조용해서예요.","The reason I like this neighborhood is that it's quiet.","The reason (why) I… is that… = a clear way to give a reason."),
];

CARDS.push(
SC("tn01","town",null,"우리 동네는 조용하고 살기 좋아.","My neighborhood is quiet and a great place to live.","a great place to live = a good area for your daily life."),
SC("tn02","town","u2","이 동네 산 지 7년 됐어.","I've lived in this neighborhood for seven years.","The line starts seven years ago and reaches today.",{trap:"I live in this neighborhood for 7 years."}),
SC("tn03","town",null,"걸어서 5분이면 지하철역이야.","There's a subway station just a five-minute walk away.","a five-minute walk away = you can walk there in five minutes. 'five-minute' has no s because it describes 'walk'.",{trap:"Subway station is 5 minutes by walking."}),
SC("tn04","town",null,"편의점이 바로 길 건너에 있어.","There's a convenience store right across the street.","right across the street = on the other side of the road, very close."),
SC("tn05","town","u6","예전엔 다 논밭이었는데 지금은 아파트가 많아.","It used to be all farmland, but now there are lots of apartments.","used to = true in the past, not now. Great for 'how has it changed?' questions."),
SC("tn06","town","u3","요즘 동네에 새 카페가 많이 생기고 있어.","A lot of new cafés have been opening in my neighborhood lately.","have been opening = it started a while ago and it's still happening."),
SC("tn07","town",null,"밤에도 꽤 안전한 편이야.","It's pretty safe, even at night.","pretty = fairly, quite. Very common in speech."),
SC("tn08","town","u7","단점이라면 주차가 좀 힘들다는 거야.","The only downside is that parking is a bit of a nightmare.","downside = the bad point. 'a bit of a nightmare' = quite difficult, said with a little humor.",{
  dlg:[["A","So, do you like living there?"],["B","I love it. The only downside is that parking is a bit of a nightmare."]],
  para:"My neighborhood has great food, and it's close to the subway. The only downside is that parking is a bit of a nightmare, so I usually leave my car at home.",
  situ:"Your friend asks about your area. Everything is good except one thing: finding a spot for your car. Mention that one bad point.",
  more:["The only downside is the price.","The only downside is that it's far from work."]}),
SC("tn09","town","u7","제일 좋은 건 집 근처 강변 산책로야.","What I love most is the riverside trail near my place.","What I love most = the thing I love most. near my place = near my home (casual)."),
SC("tn10","town","u7","처음 이사 왔을 땐 아는 사람이 하나도 없었어.","When I first moved here, I didn't know anyone.","When + past = sets the time of your story."),
SC("tn11","town","u2","이사 가기 싫어. 정이 들었거든.","I don't want to move. I've grown attached to this place.","grow attached to = slowly start to love something over time.",{trap:"I have jeong with this place."}),
SC("tn12","town","u2","동네가 많이 변했어.","My neighborhood has changed a lot.","has changed = the change connects to now: it looks different today."),

SC("nb01","nbr",null,"옆집 사람이랑 사이좋게 지내.","I get along well with my next-door neighbor.","get along (with) = have a friendly relationship.",{trap:"I'm close with the next house person."}),
SC("nb02","nbr",null,"엘리베이터에서 마주치면 인사만 해.","We just say hi when we run into each other in the elevator.","run into = meet by chance."),
SC("nb03","nbr",null,"윗집이 너무 시끄러워.","My upstairs neighbors are really noisy.","upstairs neighbors = the people who live above you."),
SC("nb04","nbr","u1","밤마다 쿵쿵거려. 미치겠어.","They're always stomping around at night. It drives me crazy.","always + -ing = it happens too much and it annoys me. stomp = walk with heavy steps."),
SC("nb05","nbr",null,"쪽지를 남겼는데 소용없었어.","I left them a note, but it didn't help.","it didn't help = it didn't make things better."),
SC("nb06","nbr",null,"결국 관리사무소에 연락했어.","In the end, I called the management office.","In the end = finally, after everything else."),
SC("nb07","nbr",null,"이웃이 택배를 대신 받아 줬어.","My neighbor picked up my package for me.","pick up = take or collect something."),
SC("nb08","nbr","u2","그 뒤로 우리 친해졌어.","We've been close ever since.","ever since = from that moment until now."),
SC("nb09","nbr","u7","요즘은 이웃이 누군지도 몰라.","These days, people don't even know who their neighbors are.","Question inside a sentence → normal order: who their neighbors are.",{trap:"People don't know who are their neighbors."}),
SC("nb10","nbr","u6","어렸을 땐 이웃끼리 음식을 나눠 먹곤 했어.","When I was a kid, neighbors would share food with each other.","would + past time = a repeated habit back then."),
SC("nb11","nbr",null,"옆집에 새 가족이 이사 왔어.","A new family just moved in next door.","move in = start living in a new home."),
SC("nb12","nbr",null,"옆집 개 때문에 밤새 못 잤어.","My neighbor's dog kept me up all night.","keep someone up = not let them sleep. English makes the dog the subject.",{trap:"I couldn't sleep because of the dog's barking sound.",
  dlg:[["A","You look exhausted."],["B","My neighbor's dog kept me up all night."],["A","Again? You should talk to them."]],
  para:"Last night was terrible. My neighbor's new puppy barked for hours, and it kept me up all night. I'm going to bring it up with them nicely.",
  situ:"Your neighbor's dog barked from midnight to morning, so you didn't sleep. Tell your coworker, starting with 'My neighbor's dog…'",
  more:["That coffee kept me up.","The baby kept us up all night."]}),

SC("hk01","hike","u1","거의 주말마다 등산 가.","I go hiking almost every weekend.","go hiking = walk on mountain trails. 'Climb a mountain' sounds like ropes and serious climbing.",{trap:"I climb the mountain every weekend."}),
SC("hk02","hike",null,"북한산에 자주 가.","I often go to Bukhansan.","Simple and clear. Add why: 'because it's close to my place.'"),
SC("hk03","hike",null,"정상까지 두 시간 정도 걸려.","It takes about two hours to get to the top.","It takes + time + to do = how long something needs.",{trap:"To the top needs two hours."}),
SC("hk04","hike","u7","올라갈 땐 힘든데 정상에 가면 다 잊어.","The climb is tough, but once you reach the top, you forget all about it.","once = as soon as, after. A clause that sets the moment."),
SC("hk05","hike",null,"정상 경치가 끝내줘.","The view from the top is amazing.","Also: breathtaking (so beautiful you almost stop breathing).",{alt:"The view from the top is breathtaking."}),
SC("hk06","hike","u3","등산 시작한 지 2년쯤 됐어.","I've been hiking for about two years now.","have been -ing + for = an activity that started then and still goes on."),
SC("hk07","hike","u7","처음엔 숨이 차서 죽는 줄 알았어.","At first, I was so out of breath I thought I was going to die.","out of breath = breathing hard after exercise. 'so … (that)' shows the result."),
SC("hk08","hike",null,"내려오다가 발목을 삐었어.","I twisted my ankle on the way down.","twist your ankle = hurt it by turning it the wrong way. on the way down = while coming down."),
SC("hk09","hike","u4","등산로가 사람으로 꽉 찼어.","The trail was packed with hikers.","packed with = very full of."),
SC("hk10","hike",null,"정상에서 먹는 컵라면이 최고지.","Nothing beats cup noodles at the top.","Nothing beats X = X is the best. Nothing else is better.",{trap:"Cup noodles at the top is the best food.",
  dlg:[["A","What do you bring when you hike?"],["B","Water, a snack, and cup noodles. Nothing beats cup noodles at the top."]],
  para:"After three hours of climbing, my legs were shaking. Then my friend pulled out a thermos and two cup noodles. Honestly, nothing beats cup noodles at the top.",
  situ:"You want to say that a cold drink after a long day is better than anything else. Start with 'Nothing…'",
  more:["Nothing beats a home-cooked meal.","Nothing beats a cold beer after work."]}),
SC("hk11","hike","u7","비 오면 미끄러워서 안 가.","I don't go when it rains because the trails get slippery.","get slippery = become easy to slip on."),
SC("hk12","hike","u2","가 본 산 중에 한라산이 제일 기억에 남아.","Of all the mountains I've climbed, Hallasan is the most memorable.","Of all the X I've done = among everything in my experience up to now."),

SC("bc01","beach","u6","여름마다 가족이랑 바다에 가곤 했어.","We used to go to the beach every summer as a family.","used to = a regular thing in the past that stopped."),
SC("bc02","beach",null,"바다를 보면 마음이 편해져.","Looking at the ocean calms me down.","English likes an activity as the subject: 'Looking at the ocean' does the calming.",{trap:"If I see the sea, my mind becomes comfortable.",
  dlg:[["A","Why do you go to the beach so often?"],["B","Looking at the ocean calms me down. It's like therapy."]],
  para:"Work has been stressful lately. When it gets too much, I drive to the coast. Just looking at the ocean calms me down.",
  situ:"Explain to a friend that seeing the sea makes you feel relaxed. Start with an -ing activity as the subject.",
  more:["Listening to music calms me down.","Walking clears my head."]}),
SC("bc03","beach",null,"해변에서 그냥 멍 때리는 게 좋아.","I love just zoning out on the beach.","zone out = stop thinking and just relax with your eyes open."),
SC("bc04","beach",null,"물이 생각보다 차가웠어.","The water was colder than I expected.","than I expected = compared to what I thought before."),
SC("bc05","beach",null,"파도가 너무 세서 수영은 못 했어.","The waves were too rough to swim in.","too + adjective + to = so much that you can't. rough = strong and wild."),
SC("bc06","beach","u5","선크림을 깜빡해서 엄청 탔어.","I forgot to put on sunscreen and got really sunburned.","got sunburned = your skin turned red and painful from the sun."),
SC("bc07","beach",null,"노을 보면서 맥주 한잔했어.","We had a beer while watching the sunset.","while + -ing = at the same time."),
SC("bc08","beach",null,"부산 해운대가 아마 제일 유명할 거야.","Haeundae in Busan is probably the most famous one.","probably = I think so, but I'm not 100% sure."),
SC("bc09","beach","u7","사람이 너무 많아서 자리 잡기도 힘들었어.","It was so crowded that we could barely find a spot.","so … that = the result. barely = almost not."),
SC("bc10","beach",null,"겨울 바다도 나름의 매력이 있어.","The ocean in winter has its own charm.","has its own charm = it's attractive in its own special way."),
SC("bc11","beach","u6","바다 근처에 살면 매일 갈 텐데.","If I lived near the ocean, I'd go every day.","Imagining → lived + would."),
SC("bc12","beach","u2","그 여행 이후로 바다가 정말 좋아졌어.","Ever since that trip, I've been in love with the ocean.","Ever since = from that moment until now."),

SC("pk01","park","u1","저녁 먹고 공원을 한 바퀴 돌아.","I take a walk around the park after dinner.","take a walk = go for a walk. A routine → simple present."),
SC("pk02","park",null,"걸으면 머리가 맑아져.","Walking clears my head.","clear your head = stop worrying and think clearly.",{trap:"If I walk, my head becomes clear.",
  dlg:[["A","You go for walks a lot, huh?"],["B","Yeah. Walking clears my head, especially after work."]],
  para:"When I'm stuck on a problem, I leave my desk and walk around the block. Walking clears my head, and the answer usually comes.",
  situ:"You've had a stressful day and your thoughts are messy. Explain why you're going outside for a walk.",
  more:["I need some fresh air.","A hot shower always clears my head."]}),
SC("pk03","park",null,"공원에 강아지 산책시키는 사람이 많아.","There are a lot of people walking their dogs in the park.","walk a dog = take it out for a walk."),
SC("pk04","park",null,"벤치에 앉아서 사람 구경해.","I sit on a bench and people-watch.","people-watch = watch people go by, just for fun."),
SC("pk05","park",null,"봄에는 벚꽃이 활짝 피어서 정말 예뻐.","In spring, the cherry blossoms are in full bloom, and it's gorgeous.","in full bloom = all the flowers are open."),
SC("pk06","park","u4","공원이 최근에 새로 단장했어.","The park was recently renovated.","The park received the work → was renovated.",{trap:"The park recently renovated."}),
SC("pk07","park",null,"거기 있으면 시간 가는 줄 몰라.","I lose track of time when I'm there.","lose track of time = forget how much time has passed."),
SC("pk08","park","u3","요즘 하루 만 보 걸으려고 노력 중이야.","I've been trying to walk ten thousand steps a day.","have been trying = an effort that has been going on recently."),
SC("pk09","park",null,"공원이 집에서 걸어갈 만한 거리야.","The park is within walking distance of my place.","within walking distance = close enough to walk."),
SC("pk10","park","u6","예전엔 운동을 싫어했는데 걷기는 달라.","I used to hate working out, but walking is different.","used to = it was true before, not now."),
SC("pk11","park","u8","그 공원은 내가 생각 정리하러 가는 곳이야.","That park is where I go to think.","where I go to think = the place for my thinking."),
SC("pk12","park",null,"잔디에 돗자리 펴고 피크닉 했어.","We laid out a mat on the grass and had a picnic.","lay out = spread something flat on the ground."),

SC("mu01","music","u1","출퇴근할 때 늘 음악 들어.","I always listen to music on my commute.","commute = the trip to and from work."),
SC("mu02","music","u3","요즘 재즈에 푹 빠졌어.","I've been really into jazz lately.","be into = really like. have been + lately = recently, until now.",{trap:"Recently I fell in jazz."}),
SC("mu03","music",null,"이 노래 들으면 대학 시절이 생각나.","This song reminds me of my college days.","remind me of = makes me remember.",{trap:"When I hear this song, I think of my university time.",
  dlg:[["A","Why are you smiling?"],["B","This song reminds me of my college days. We played it at every party."]],
  para:"Yesterday a song came on in a café. It reminded me of my first trip abroad, and suddenly I could almost smell the ocean.",
  situ:"A song comes on and makes you remember summer vacations with your family. Tell your friend.",
  more:["You remind me of my sister.","That smell reminds me of home."]}),
SC("mu04","music","u7","기분에 따라 듣는 음악이 달라.","What I listen to depends on my mood.","depends on = changes because of. 'What I listen to' is one thing → depends."),
SC("mu05","music",null,"그 가수 노래는 전부 외워.","I know all of her songs by heart.","by heart = from memory."),
SC("mu06","music","u8","콘서트에 처음 간 건 고등학생 때야.","The first time I went to a concert was in high school.","'The first time I went…' = the name tag tells you which time."),
SC("mu07","music",null,"라이브로 들으니까 소름 돋았어.","Hearing it live gave me goosebumps.","goosebumps = little bumps on your skin when you're moved or cold.",{trap:"I had chicken skin."}),
SC("mu08","music",null,"표 구하기가 하늘의 별 따기였어.","Getting tickets was almost impossible.","Say the meaning simply. Also: 'Tickets sold out in seconds.'",{alt:"Tickets sold out in seconds."}),
SC("mu09","music",null,"노래는 못하지만 노래방은 좋아해.","I'm not a great singer, but I love karaoke.","English describes you as a type of person: a great singer."),
SC("mu10","music",null,"어렸을 때 피아노 배웠었어.","I took piano lessons when I was a kid.","take lessons = learn with a teacher."),
SC("mu11","music","u6","시간이 있으면 기타를 배우고 싶어.","If I had the time, I'd love to learn the guitar.","Imagining → had + would."),
SC("mu12","music","u1","플레이리스트 만들어서 친구들이랑 공유해.","I make playlists and share them with my friends.","A habit → simple present."),

SC("mv01","movie",null,"집에서 넷플릭스로 영화 보는 걸 좋아해.","I like watching movies on Netflix at home.","on Netflix = using that service."),
SC("mv02","movie","u3","요즘 스릴러를 몰아 보고 있어.","I've been binge-watching thrillers lately.","binge-watch = watch a lot in a row."),
SC("mv03","movie","u4","그 영화는 실화를 바탕으로 했어.","The movie is based on a true story.","based on = made from. The movie received the action."),
SC("mv04","movie",null,"결말이 완전 예상 밖이었어.","The ending totally caught me off guard.","catch someone off guard = surprise them when they're not ready.",{trap:"The ending was out of expectation.",
  dlg:[["A","Did you like the ending?"],["B","It totally caught me off guard. I didn't see it coming."]],
  para:"I thought it was a simple love story. But in the last ten minutes, there was a huge twist. It totally caught me off guard.",
  situ:"In a meeting, your boss suddenly asks you a question you weren't ready for. Describe how the question felt.",
  more:["I didn't see that coming.","Her question caught me off guard."]}),
SC("mv05","movie","u7","너무 슬퍼서 펑펑 울었어.","It was so sad that I cried my eyes out.","cry your eyes out = cry very hard."),
SC("mv06","movie",null,"스포하지 마!","Don't spoil it for me!","spoil = tell someone the ending too early."),
SC("mv07","movie",null,"그 배우 연기 진짜 잘했어.","That actor really nailed the role.","nail = do something perfectly.",{alt:"Her acting was amazing."}),
SC("mv08","movie",null,"원작 소설이 더 나았어.","The book was better than the movie.","Simple comparison. Natives say 'the book', not 'the original novel'."),
SC("mv09","movie","u8","극장에 마지막으로 간 게 언젠지 기억도 안 나.","I can't even remember the last time I went to a movie theater.","the last time I went = the name tag tells you which time."),
SC("mv10","movie",null,"극장에서 보면 몰입감이 달라.","Watching it in a theater is a totally different experience.","a totally different experience = it feels much better in a special way."),
SC("mv11","movie",null,"그 영화 보고 생각이 많아졌어.","That movie really made me think.","make me think = caused me to think deeply."),
SC("mv12","movie","u7","영화 고르기 전에 보통 리뷰를 봐.","I usually check the reviews before I pick a movie.","before + clause = the order of actions."),

SC("cf01","cafe","u1","일주일에 서너 번은 카페에 가.","I go to cafés three or four times a week.","How often → simple present."),
SC("cf02","cafe","u8","집 근처에 자주 가는 카페가 있어.","There's a café near my place that I go to all the time.","'that I go to' = the name tag. If they know you there, say 'I'm a regular.'"),
SC("cf03","cafe",null,"사장님이 내 주문을 외우고 있어.","The owner knows my order by heart.","by heart = from memory."),
SC("cf04","cafe",null,"거기서 공부하거나 일하는 사람이 많아.","A lot of people study or work there.","Simple and clear."),
SC("cf05","cafe",null,"분위기가 아늑하고 음악도 좋아.","It has a cozy vibe and great music.","cozy = warm, comfortable, and relaxing."),
SC("cf06","cafe",null,"커피보다는 분위기 때문에 가.","I go there more for the vibe than the coffee.","go for X = X is the reason you go.",{
  dlg:[["A","Is their coffee that good?"],["B","Honestly, it's just okay. I go there more for the vibe."]],

const LS="ttyEnglish.v1";
const today=()=>new Date().toLocaleDateString("sv-SE");
const addDays=(d,n)=>{const t=new Date(d+"T12:00:00");t.setDate(t.getDate()+n);return t.toLocaleDateString("sv-SE")};
const blank=()=>({v:1,updatedAt:0,xp:0,goal:100,days:{},read:{},qs:{},wrong:[],srs:{},mine:[],cel:""});
let S=blank();
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
let remote=null,saveT=null,syncState="local";
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(remote){clearTimeout(saveT);saveT=setTimeout(pushRemote,1500)}}
let pushing=false,again=false;
async function pushRemote(){if(!remote)return;if(pushing){again=true;return}pushing=true;
  try{await remote.set(JSON.parse(JSON.stringify(S)));setSync("on")}catch(e){setSync("err")}
  pushing=false;if(again){again=false;pushRemote()}}
function setSync(s){syncState=s;const el=document.getElementById("sync");if(!el)return;
  el.className="sync"+(s==="on"?" on":"");el.textContent=s==="on"?"☁ 계정에 저장 중":s==="err"?"이 기기에만 저장됨":"이 기기에 저장"}
(async()=>{try{if(!window.claude?.use)return;const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!user||!db)return;const id=await user.id();if(!id)return;
  const ref=db.doc("data/users/"+id+"/state");const snap=await ref.get();remote=ref;
  if(snap.exists){const r=snap.data();if((r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}else if(S.updatedAt>(r.updatedAt||0))pushRemote()}
  else if(S.updatedAt)pushRemote();setSync("on")}catch(e){setSync("err")}})();
