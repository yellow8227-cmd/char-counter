<title>바로 튀어나오는 영어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 말풍선 수험표 — 위에 응시표 헤더와 과목 탭, 가운데 한 장씩 집중하는 카드. 상식·CAT 앱과 같은 잉크/OMR 빨강에 영어용 파랑 말풍선을 더함 */
:root{
  --paper:#f1f3f9; --sheet:#ffffff; --ink:#1b2440; --muted:#5b6582; --line:#d8deeb;
  --red:#dc3550; --red-soft:#fde7eb; --blue:#2f56d9; --blue-soft:#e5ebff; --mark:#ffe46b;
  --ok:#1d8556; --ok-soft:#e0f3e9; --warn:#a96800; --warn-soft:#fff2d4; --bub:#eef1f8;
  --kd:"Do Hyeon","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --en:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(27,36,64,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10141e; --sheet:#181f2e; --ink:#e7ebf5; --muted:#9aa4bf; --line:#2c3447;
  --red:#ff6b82; --red-soft:#3a1d26; --blue:#8ea8ff; --blue-soft:#1d2a4f; --mark:#6b5a12;
  --ok:#4fd197; --ok-soft:#163327; --warn:#f0b44c; --warn-soft:#3a2c12; --bub:#202a3d;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141e; --sheet:#181f2e; --ink:#e7ebf5; --muted:#9aa4bf; --line:#2c3447;
  --red:#ff6b82; --red-soft:#3a1d26; --blue:#8ea8ff; --blue-soft:#1d2a4f; --mark:#6b5a12;
  --ok:#4fd197; --ok-soft:#163327; --warn:#f0b44c; --warn-soft:#3a2c12; --bub:#202a3d;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.en{font-family:var(--en);letter-spacing:-.005em}
.muted{color:var(--muted)}
mark.hl{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 1px;border-radius:2px}

/* header */
header{display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.ticket{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.ticket span:last-child{color:var(--muted)}
.title{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--kd);font-weight:400;font-size:clamp(30px,7vw,44px);line-height:1.1}
.h1bub{font-family:var(--en);font-weight:700;font-size:15px;background:var(--blue);color:var(--sheet);border-radius:14px 14px 14px 3px;padding:4px 11px;margin-bottom:6px;white-space:nowrap}
.statline{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.statline b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.sync.on{color:var(--ok);border-color:var(--ok)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.tabs button{border:0;background:var(--sheet);padding:9px 2px 8px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25}
.tabs button small{font-family:var(--en);font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.tabs button[aria-pressed="true"] small{color:var(--mark)}

/* common pieces */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--kd);font-weight:400;font-size:24px;line-height:1.2}
.lbl{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.lbl.b{color:var(--blue)}.lbl.g{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:11px;padding:10px 16px;min-height:46px;text-align:center;line-height:1.3}
.btn.pri{background:var(--ink);color:var(--sheet)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:13.5px;border-radius:9px}
.btn.grow{flex:1 1 140px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;min-height:38px;font-size:14px}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px;font-size:11.5px}
.chip[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700}
.chip[aria-pressed="true"] small{color:var(--red)}
.say{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;min-width:38px;height:38px;padding:0 10px;font-size:15px;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700}
.say small{font-size:11px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.meter.ok i{background:var(--ok)}.meter.red i{background:var(--red)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--muted)}
textarea,input[type=text]{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--sheet);color:var(--ink);resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--blue);outline:none}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.today{border:1.5px solid var(--ink)}
.today .big{font-family:var(--kd);font-size:44px;line-height:1}
.today .big small{font-size:18px;color:var(--muted);margin-left:4px}
.goalpick{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.goalpick button{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:2px 8px;min-height:30px;font-size:12.5px}
.goalpick button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.week{display:flex;gap:6px;align-items:flex-end;height:46px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:22px;min-height:3px;background:var(--line);border-radius:4px}
.week .hit i{background:var(--ok)}
.week .now span{color:var(--ink);font-weight:700}
.ladder{display:flex;flex-direction:column;gap:8px}
.rungs{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.rung{height:30px;border-radius:6px;background:var(--bub);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted)}
.rung.got{background:var(--blue-soft);color:var(--blue)}
.rung.cur{background:var(--blue);color:var(--sheet);box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--blue)}
.lvname{font-family:var(--en);font-weight:800;font-size:30px;line-height:1;color:var(--blue)}
.mission{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.mission{grid-template-columns:1fr}}
.mis{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:112px}
.mis:hover{border-color:var(--ink)}
.mis b{font-size:17px}
.mis span{font-size:13px;color:var(--muted)}
.mis .n{font-family:var(--kd);font-size:30px;line-height:1;color:var(--red)}
.mis.blue .n{color:var(--blue)}.mis.green .n{color:var(--ok)}
.weak{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.weak{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wk{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.wk:hover{border-color:var(--ink)}
.wk .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wk b{font-size:14.5px;line-height:1.35;word-break:keep-all}
.wk .pct{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.hot{border-color:var(--red);background:var(--red-soft)}
.wk.hot .pct{color:var(--red);font-weight:600}
.method{border-left:4px solid var(--blue);border-radius:0 14px 14px 0}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
@media (max-width:640px){.steps3{grid-template-columns:1fr}}
.steps3 li{background:var(--bub);border-radius:12px;padding:12px;font-size:14px;line-height:1.55}
.steps3 b{display:block;font-size:15px;margin-bottom:2px}

/* grammar */
.unitlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.unitlist{grid-template-columns:1fr}}
.utile{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.utile:hover{border-color:var(--ink)}
.utile .num{grid-row:span 3;font-family:var(--kd);font-size:34px;line-height:1;color:var(--red)}
.utile b{font-size:17px}
.utile .en{font-size:13.5px;color:var(--muted);line-height:1.45}
.utile .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--bub);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.red{background:var(--red-soft);color:var(--red)}.tag.blue{background:var(--blue-soft);color:var(--blue)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.06em}
.utitle{font-family:var(--kd);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1.15}
.bigidea{font-family:var(--en);font-size:clamp(19px,4.4vw,23px);font-weight:600;line-height:1.45;text-wrap:pretty}
.pic{background:var(--bub);border-radius:12px;padding:10px;overflow-x:auto}
.pic svg{display:block;width:100%;min-width:300px;max-width:620px;height:auto;margin:0 auto}
.pic text{font-family:var(--en);fill:var(--ink);font-size:13px}
.pic .t-m{fill:var(--muted);font-size:11.5px}
.pic .t-b{font-weight:700}
.pic .t-acc{fill:var(--blue);font-weight:700}
.pic .t-red{fill:var(--red);font-weight:700}
.sv-axis{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
.sv-now{stroke:var(--red);stroke-width:2.5;stroke-dasharray:4 4}
.sv-acc{stroke:var(--blue);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-accf{fill:var(--blue)}
.sv-soft{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.sv-inkf{fill:var(--ink)}
.sv-paper{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.sv-mark{fill:var(--mark)}
.sv-faint{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 4}
.sv-redf{fill:var(--red)}
.point{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.point:first-of-type{border-top:0;padding-top:0}
.point h3{font-family:var(--en);font-size:18px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.point h3 .pn{font-family:var(--mono);font-size:12px;color:var(--red);font-weight:500;flex:none}
.point p{margin:0;color:var(--muted);font-family:var(--en);font-size:15.5px;line-height:1.6}
.exs{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.exs li{display:flex;gap:8px;align-items:center;background:var(--bub);border-radius:10px;padding:7px 8px 7px 12px}
.exs li .en{flex:1;min-width:0;font-size:16.5px;line-height:1.5}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;display:flex;gap:6px;align-items:flex-end}
.bub .txt{font-family:var(--en);font-size:16.5px;line-height:1.5;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bub)}
.bub.B{align-self:flex-end;flex-direction:row-reverse}
.bub.B .txt{background:var(--blue-soft);border-radius:16px 16px 4px 16px}
.bub .who{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;padding-bottom:6px}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-family:var(--en);font-size:16px;line-height:1.5}
.mi .x{color:var(--red);font-weight:700}.mi .o{color:var(--ok);font-weight:700}
.mi .bad{text-decoration:line-through;text-decoration-color:var(--red);color:var(--muted)}
.mi .why{grid-column:2;font-size:14px;color:var(--muted)}
.opic{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-family:var(--en);font-size:15.5px;line-height:1.6}
.opic b{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--warn);display:block}

/* AI box */
.ai{border:1.5px dashed var(--blue);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--blue-soft) 45%,var(--sheet))}
.ai .h{display:flex;gap:8px;align-items:center;font-weight:700}
.ai .h .dot{width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--sheet);display:grid;place-items:center;font-size:12px;font-family:var(--en);font-weight:800;flex:none}
.aiout{font-family:var(--en);font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.aiout:empty{display:none}
.think{font-family:var(--en);background:var(--bub);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.6}
.think .lbl{display:block;margin-bottom:2px}
.res{display:flex;flex-direction:column;gap:10px}
.res .main{font-family:var(--en);font-size:22px;font-weight:700;line-height:1.35}
.res ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-family:var(--en)}
.res .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chunk{display:flex;gap:6px;flex-wrap:wrap}
.chunk span{background:var(--sheet);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-family:var(--en);font-size:14.5px}
.chunk span b{color:var(--blue)}
.verdict{align-self:flex-start;font-weight:800;border-radius:999px;padding:4px 12px;font-size:14px;font-family:var(--en)}
.verdict.natural{background:var(--ok-soft);color:var(--ok)}.verdict.ok{background:var(--blue-soft);color:var(--blue)}
.verdict.unnatural,.verdict.wrong-meaning{background:var(--red-soft);color:var(--red)}

/* speak */
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.deck{grid-template-columns:1fr}}
.modebtn{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.modebtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.modebtn b{font-size:16px}.modebtn span{font-size:13px;color:var(--muted);line-height:1.5}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.flash{min-height:360px;position:relative}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.prompt-ko{font-family:var(--kd);font-size:clamp(28px,7vw,40px);line-height:1.3;word-break:keep-all;text-wrap:balance;padding:10px 0}
.prompt-en{font-family:var(--en);font-size:clamp(19px,4.6vw,23px);font-weight:600;line-height:1.5}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring text{font-family:var(--mono);font-size:18px;fill:var(--ink);font-weight:600}
.answer{font-family:var(--en);font-size:clamp(24px,6vw,32px);font-weight:800;line-height:1.3;color:var(--blue);text-wrap:balance}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.vs{grid-template-columns:1fr}}
.vs div{border-radius:12px;padding:10px 12px;font-family:var(--en);font-size:15.5px;line-height:1.45}
.vs .kr{background:var(--red-soft)}.vs .kr .lbl{color:var(--red)}
.vs .kr p{text-decoration:line-through;text-decoration-color:var(--red);margin:2px 0 0}
.vs .eng{background:var(--ok-soft)}.vs .eng .lbl{color:var(--ok)}
.vs p{margin:2px 0 0;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 4px;min-height:58px;font-weight:700;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.rate button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.rate .r0{border-color:var(--red);color:var(--red)}.rate .r1{border-color:var(--warn);color:var(--warn)}.rate .r2{border-color:var(--ok);color:var(--ok)}
.reps{display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;gap:4px}
.stepper i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepper i.on{background:var(--blue)}
.para{font-family:var(--en);font-size:17px;line-height:1.75;background:var(--bub);border-radius:12px;padding:14px 16px}
.situ{font-family:var(--en);font-size:18px;line-height:1.6;border:1.5px solid var(--ink);border-radius:12px;padding:14px 16px;position:relative}
.situ::before{content:"Imagine…";display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.more{display:flex;flex-direction:column;gap:6px}

/* quiz */
.qcard{min-height:380px}
.qtype{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--bub);color:var(--muted)}
.qtxt{font-family:var(--en);font-size:clamp(19px,4.6vw,22px);font-weight:600;line-height:1.55;white-space:pre-line}
.qtxt.quote{border-left:4px solid var(--mark);padding-left:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 14px;min-height:54px;font-family:var(--en);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .dot{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--red);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--red)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .dot{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .dot{background:var(--red);border-color:var(--red);color:var(--sheet)}
.why{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.why .v{font-weight:800;font-size:17px}
.why .v.ok{color:var(--ok)}.why .v.ng{color:var(--red)}
.why .en{font-size:16px;line-height:1.6}
.score{font-family:var(--kd);font-size:60px;line-height:1}
.score small{font-size:22px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:8px}
.wli{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:0 10px 10px 0;padding:8px 12px;font-family:var(--en);font-size:15px;line-height:1.5;white-space:pre-line}
.wli .a{color:var(--ok);font-weight:700}

/* boss */
.boss{display:flex;gap:14px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:12px;background:linear-gradient(135deg,var(--blue-soft),var(--sheet))}
.bossface{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-weight:800;font-size:22px;color:#fff;background:radial-gradient(circle at 35% 30%,#6f8dff,#1c2f8f);box-shadow:0 6px 18px rgba(47,86,217,.45);animation:breathe 1.8s ease-in-out infinite}
.bossface.dead{filter:grayscale(1);animation:none;transform:rotate(-14deg)}
.bossinfo{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.bossinfo .nm{font-family:var(--en);font-weight:800}
.bhp{height:14px;border-radius:8px;background:var(--line);overflow:hidden;border:1.5px solid var(--ink)}
.bhp i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#9b6bff);transition:width .35s ease}
.hearts{color:var(--red);font-size:18px;letter-spacing:2px}.hearts s{opacity:.22;text-decoration:none}
.combo{font-family:var(--mono);font-size:12px;color:var(--red);font-weight:600}
@keyframes breathe{50%{transform:scale(1.06)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:var(--kd);font-size:34px;pointer-events:none;z-index:80;animation:floatup .9s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 var(--sheet)}
.pop.g{color:var(--ok)}.pop.r{color:var(--red)}.pop.b{color:var(--blue)}
@keyframes floatup{to{transform:translate(-50%,-50px);opacity:0}}

/* coach */
.mylist{display:flex;flex-direction:column;gap:8px}
.my{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.my .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.my .en{font-size:16.5px;font-weight:700;line-height:1.4}
.my .ko{font-size:13px;color:var(--muted)}
.my .tk{font-family:var(--en);font-size:13.5px;color:var(--muted);line-height:1.5}
.x-del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px;min-height:36px}

/* selection explain + sheet */
.selbtn{position:absolute;z-index:70;background:var(--ink);color:var(--sheet);border:0;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);min-height:36px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--sheet);border-top:1.5px solid var(--ink);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:78vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--sheet);font-weight:700;font-size:14px;border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
footer{font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ───────── 문법 단원 ─────────
   [[...]] = 형광펜으로 칠할 부분. 설명은 모두 쉬운 영어. */
const UNITS=[
{id:"u1",no:1,ko:"현재 vs 현재진행",en:"Simple vs -ing",pic:"now",
 big:"Simple present is the normal setting of your life. Present continuous is what's on the screen right now.",
 points:[
  {h:"Simple present = your profile",p:"Use it for habits, facts, and things that are generally true about you. It doesn't matter what you're doing at this second.",
   ex:["I [[work]] at a bank.","I [[drink]] coffee every morning.","My sister [[lives]] in Busan."]},
  {h:"-ing = happening now, or around now",p:"Use it for something in progress right now, or a temporary situation these days.",
   ex:["Sorry, I[['m driving]]. Can I call you back?","I[['m working]] from home this week.","I[['m reading]] a really good book these days."]},
  {h:"Same verb, different picture",p:"Simple feels permanent. -ing feels temporary.",
   ex:["I [[live]] in Seoul. (my home)","I[['m living]] with my sister for now. (not forever)","He's rude. → He[['s being]] rude today. (not his normal self)"]},
  {h:"-ing for plans you already set",p:"If the time and people are already decided, -ing works for the future. You'll need this a lot in OPIc role-plays.",
   ex:["I[['m meeting]] Jisoo tomorrow.","What [[are]] you [[doing]] this weekend?"]},
  {h:"State words usually stay simple",p:"know, like, want, need, believe, understand, own, belong, seem, mean are states, not actions. Nothing is 'in progress', so no -ing.",
   ex:["I [[know]] what you mean.","I [[think]] it's good. (my opinion) / I[['m thinking]] about quitting. (my mind is working on it)","I [[have]] a car. (own it) / I[['m having]] lunch. (eating = an action)"]},
  {h:"always + -ing = a complaint",p:"It means 'this happens too often, and it annoys me.'",
   ex:["He[['s always losing]] his keys!","You[['re always checking]] your phone."]}
 ],
 dialog:[["A","What [[do]] you [[do]]?"],["B","I [[work]] in marketing. But I[['m not working]] this week. I'm on vacation."],["A","Nice! So what [[are]] you [[doing]] these days?"],["B","I[['m taking]] a pottery class. I usually [[go]] on Tuesdays."],["A","[[Do]] you [[like]] it?"],["B","I [[love]] it. I[['m making]] a mug right now, actually. Well, I[['m trying]] to."]],
 mistakes:[
  ["I am go to school every day.","I go to school every day.","Habit → just 'I go'. Don't add 'am'."],
  ["What do you do now? — I watch TV.","What are you doing? — I'm watching TV.","'What do you do?' asks about your job. 'What are you doing?' asks about this moment."],
  ["I'm knowing him.","I know him.","know = a state. No -ing."],
  ["I'm usually going to the gym.","I usually go to the gym.","usually / always / every day = routine → simple."]
 ],
 opic:"'Tell me about your typical day' → simple present (I wake up at 7, I usually…). Then add 'These days, I'm…' to sound current and real."
},
{id:"u2",no:2,ko:"have p.p. 계속 용법",en:"From then until now",pic:"line",
 big:"have + p.p. connects the past to NOW. It started before, and it's still true today.",
 points:[
  {h:"Started in the past, still true now",p:"One line from a past point to now. The line is not finished.",
   ex:["I[['ve lived]] in Seoul for five years. (I still live there.)","I [[lived]] in Seoul for five years. (I don't live there now.)"]},
  {h:"for + length / since + starting point",p:"for two years, for a long time, for ages · since 2020, since high school, since I was a kid.",
   ex:["We[['ve been]] friends [[for]] ten years.","I[['ve had]] this phone [[since]] 2022.","She[['s worked]] here [[since]] she graduated."]},
  {h:"How long have you…?",p:"This is the natural way to ask about a time line up to now.",
   ex:["[[How long have you worked]] there?","[[How long have you known]] each other?","[[How long have you been]] married?"]},
  {h:"Great with state words",p:"know, have, be, like can't take -ing, so this is how you say how long.",
   ex:["I[['ve known]] her since middle school.","I[['ve always liked]] spicy food."]},
  {h:"Negative = a gap until now",p:"Nothing has happened from that point until now.",
   ex:["I [[haven't seen]] him for ages.","I [[haven't eaten]] since breakfast."]},
  {h:"Other jobs of have p.p. — same core",p:"Experience and fresh results also connect the past to now.",
   ex:["I[['ve been]] to Japan twice. (my experience up to now)","I[['ve lost]] my wallet. (it's still lost now)"]}
 ],
 dialog:[["A","[[How long have you lived]] in this neighborhood?"],["B","[[Since]] 2019. So about seven years."],["A","Then you must know all the good places."],["B","Ha, I[['ve known]] the owner of that noodle place for years."],["A","I [[haven't had]] good noodles since I moved here."],["B","Let's go, then. I [[haven't been]] there for a while either."]],
 mistakes:[
  ["I live here for 3 years.","I've lived here for 3 years.","'live' alone talks only about now. 'for 3 years' needs a line from the past."],
  ["I've lived here since 3 years.","I've lived here for 3 years.","Length → for. Starting point → since."],
  ["I know him since high school.","I've known him since high school.","since + now → have p.p."],
  ["I've lived in Busan when I was a kid.","I lived in Busan when I was a kid.","A finished time (when I was a kid, last year, in 2015) → simple past."]
 ],
 opic:"Background answers sound stronger with a time line: 'I've lived in my apartment for about four years.' 'I've worked at my company since 2021.'"
},
{id:"u3",no:3,ko:"have been ~ing",en:"Been doing",pic:"zigzag",
 big:"An activity started before and has been going on until now. The focus is on the doing, and on how long.",
 points:[
  {h:"Going on up to now",p:"The action started in the past and is probably still going.",
   ex:["I[['ve been studying]] English for six months.","It[['s been raining]] all day."]},
  {h:"Just stopped — you can see the result",p:"The activity just finished, and there's evidence now.",
   ex:["Sorry I'm sweaty. I[['ve been running]].","Your eyes are red. [[Have]] you [[been crying]]?"]},
  {h:"Doing vs done",p:"have been -ing = the activity (maybe not finished). have p.p. = the result or the number.",
   ex:["I[['ve been reading]] this book. (still reading)","I[['ve read]] this book. (finished)","I[['ve been writing]] emails all morning. / I[['ve written]] 20 emails."]},
  {h:"Lately / recently",p:"Perfect for talking about what's been going on in your life.",
   ex:["I[['ve been feeling]] tired lately.","What [[have]] you [[been up to]]? (= What have you been doing lately?)"]},
  {h:"Not with state words",p:"know, own, believe, belong don't take -ing.",
   ex:["I[['ve known]] him for years. (✗ been knowing)","But: I[['ve been having]] trouble sleeping. (having = experiencing, OK)"]},
  {h:"live / work: both OK",p:"I've lived here for 5 years ≈ I've been living here for 5 years. The -ing version feels a little more active or temporary.",
   ex:["I[['ve been working]] here since March."]}
 ],
 dialog:[["A","Hey! Long time no see. What [[have]] you [[been up to]]?"],["B","I[['ve been working]] a lot. And I[['ve been learning]] to swim."],["A","Swimming? How long [[have]] you [[been doing]] that?"],["B","About three months. I[['ve been going]] every morning before work."],["A","No wonder you look so healthy."],["B","Thanks! But I[['ve been sleeping]] badly. I'm so tired."]],
 mistakes:[
  ["I'm studying English for 2 years.","I've been studying English for 2 years.","for + up to now → have been -ing."],
  ["I've been knowing her for years.","I've known her for years.","know = a state."],
  ["I've been drinking three cups of coffee today.","I've had three cups of coffee today.","A number of finished things → have p.p."],
  ["I've been working here since 3 years.","I've been working here for 3 years.","Length → for."]
 ],
 opic:"'Recently, I've been getting into…' or 'I've been trying to…' is a great way to start answers about hobbies or changes in your life."
},
{id:"u4",no:4,ko:"수동태 be + p.p.",en:"The passive",pic:"spot",
 big:"Put the thing that receives the action in the spotlight. Who did it is unknown, not important, or obvious.",
 points:[
  {h:"Spotlight on the receiver",p:"Say what happened to it. The doer can stay hidden.",
   ex:["My bike [[was stolen]]. (I don't know who did it.)","This bridge [[was built]] in 1990."]},
  {h:"Everyday phrases you already need",p:"Many common phrases are really this pattern.",
   ex:["I [[was born]] in Daegu.","It's [[made]] in Korea.","The store [[is closed]].","Is this seat [[taken]]?"]},
  {h:"get + p.p. = the casual 'it happened' version",p:"In speech, get is very common, especially for sudden or unexpected changes.",
   ex:["My flight [[got canceled]].","We [[got lost]].","I [[got paid]] today!","He [[got fired]]."]},
  {h:"The time lives in 'be'",p:"Change be, keep the p.p.",
   ex:["My car [[is being fixed]], so I took the bus. (now)","The meeting [[has been moved]] to Friday.","It'll [[be done]] by tomorrow."]},
  {h:"by + doer, only when it matters",p:"Add 'by' only if the doer is new or interesting information.",
   ex:["This song [[was written by]] my favorite singer."]},
  {h:"Feelings and rules",p:"Lots of feelings and rules use be + p.p.",
   ex:["I'm [[interested]] in photography.","I'm [[worried]] about my exam.","I [[was told]] to wait here.","We're [[supposed to]] meet at seven."]}
 ],
 dialog:[["A","Why are you taking the bus? Where's your car?"],["B","It[['s being fixed]]. It [[got hit]] in the parking lot last week."],["A","Oh no! [[Was]] anyone [[hurt]]?"],["B","No, nobody was in it. But the back door [[was]] totally [[smashed]]."],["A","Will it [[be]] ready soon?"],["B","I [[was told]] it'll [[be done]] by Friday."]],
 mistakes:[
  ["I was borned in Seoul.","I was born in Seoul.","born is already the p.p."],
  ["It was happened yesterday.","It happened yesterday.","happen, arrive, die, sleep have no receiver, so no passive."],
  ["The package delivered yesterday.","The package was delivered yesterday.","The package didn't deliver anything. Someone delivered it."],
  ["I'm interesting in music.","I'm interested in music.","-ed = how you feel. -ing = what makes you feel it."]
 ],
 opic:"Use it for places and problems: 'My apartment was built about ten years ago.' 'The concert got canceled because of the rain.'"
},
{id:"u5",no:5,ko:"p.p.의 뜻",en:"What p.p. feels like",pic:"done",
 big:"A p.p. word carries one feeling: done. The action is finished, or someone or something received it.",
 points:[
  {h:"p.p. = done / received",p:"broken = someone broke it, so now it's in a broken state. closed, finished, used, lost work the same way.",
   ex:["My phone is [[broken]].","The shop is [[closed]].","I'm [[done]]!"]},
  {h:"p.p. before a noun = a description",p:"It describes the state of the thing.",
   ex:["a [[used]] car","[[frozen]] food","a [[locked]] door","I'm [[lost]]."]},
  {h:"-ed feeling vs -ing cause",p:"-ed = what you feel. -ing = what makes people feel it.",
   ex:["I'm [[bored]]. / This movie is [[boring]].","I'm [[confused]]. / The map is [[confusing]].","I was so [[embarrassed]]. / It was [[embarrassing]]."]},
  {h:"noun + p.p. = 'that was ~ed'",p:"Add a p.p. after a noun to say what was done to it.",
   ex:["a car [[made]] in Germany (= a car that was made in Germany)","the photos [[taken]] last night","a language [[spoken]] in many countries"]},
  {h:"One p.p., many frames",p:"The 'done' feeling stays the same. The frame around it changes.",
   ex:["I [[have finished]]. (done up to now)","It [[is finished]]. (it's in a finished state)","the work [[finished]] today (description)"]},
  {h:"get/have something done = someone does it for you",p:"You didn't do it yourself. Someone did it for you.",
   ex:["I [[got]] my hair [[cut]].","I [[had]] my phone [[fixed]]."]}
 ],
 dialog:[["A","Did you get a haircut?"],["B","Yeah, I [[got]] it [[cut]] yesterday. Do you like it?"],["A","Love it. You look so [[relaxed]]."],["B","I'm so [[relieved]]. My last haircut was a disaster. I was so [[embarrassed]]."],["A","Haha, that was a really [[embarrassing]] story."],["B","Don't remind me. Anyway, I'm [[done]] with that salon."]],
 mistakes:[
  ["I'm boring.","I'm bored.","'I'm boring' means you make other people bored!"],
  ["I cut my hair at a salon.","I got my hair cut at a salon.","Unless you cut it yourself."],
  ["a car making in Korea","a car made in Korea","The car received the action → p.p."],
  ["I'm so exciting about the trip.","I'm so excited about the trip.","You feel it → -ed."]
 ],
 opic:"Feeling words make your stories vivid: 'I was so surprised.' 'It was a little disappointing.' 'I felt really relieved.'"
},
{id:"u6",no:6,ko:"would 다시 보기",en:"The feeling of would",pic:"would",
 big:"would = will, but one step away: away from reality (imagining), away in time (the past), or a polite step back.",
 points:[
  {h:"Imagining (not real now)",p:"Use it for situations that aren't true right now. After 'if', use the past form.",
   ex:["I[['d travel]] more if I [[had]] more time.","If I were you, I[['d take]] the job.","I [[would never]] do that."]},
  {h:"Polite and soft",p:"would sounds gentler than will or want.",
   ex:["[[Would]] you like some coffee?","I[['d like]] a latte, please.","[[Would]] you mind closing the window?","That [[would be]] great."]},
  {h:"I'd love to / I'd rather",p:"I'd love to = yes, happily. I'd rather = I prefer to.",
   ex:["I[['d love to]] come!","I[['d rather]] stay home tonight."]},
  {h:"Past habits (repeated actions)",p:"For things you did again and again in the past. For past states (be, have, live, like), use 'used to'.",
   ex:["When I was a kid, I [[would]] play outside until dark.","I [[used to]] have long hair. (✗ I would have long hair)"]},
  {h:"will, seen from the past",p:"When you report what someone said or thought before.",
   ex:["He said he[['d call]] me. (He said, 'I'll call you.')","I knew you[['d like]] it."]},
  {h:"would have p.p. = imagining the past",p:"It didn't happen. You're imagining another past.",
   ex:["I [[would have come]] if you'd told me. (I didn't come.)","That [[would have been]] fun."]},
  {h:"wouldn't = refused",p:"Something or someone refused to work or act.",
   ex:["My car [[wouldn't]] start this morning.","The kid [[wouldn't]] stop crying."]}
 ],
 dialog:[["A","[[Would]] you like to grab dinner on Friday?"],["B","I[['d love to]]! Where [[would]] you want to go?"],["A","How about that Thai place? I think you[['d like]] it."],["B","Perfect. When I lived in Bangkok, I [[would]] eat pad thai every day."],["A","Then this [[would be]] a good test, haha."],["B","Honestly, if I had time, I[['d move]] back there."]],
 mistakes:[
  ["If I have money, I would buy a house.","If I had money, I would buy a house.","Imagining → past form after if (had), would in the other part."],
  ["I would like go.","I'd like to go.","would like + to + verb."],
  ["When I was young, I would be shy.","I used to be shy.","A past state → used to."],
  ["If I would know, I would tell you.","If I knew, I would tell you.","No would after if (in imagining)."]
 ],
 opic:"Role-play questions: 'Would it be possible to…?', 'Would you mind…?'. Imagining questions: 'If you could…, what would you do?' → 'I would…'."
},
{id:"u7",no:7,ko:"문장의 절 구조",en:"Building with clauses",pic:"blocks",
 big:"A clause is one 'someone + does/is something' unit. A long sentence is just small clauses connected. Say one, then add the next.",
 points:[
  {h:"One clause = subject + verb",p:"Count the subject-verb pairs.",
   ex:["[[I was]] tired. (1)","[[I was]] tired, so [[I went]] home early. (2)"]},
  {h:"Add a reason, a time, or a condition",p:"because, when, if, before, after, while, although, until, as soon as. Talking about the future after when/if? Use the present.",
   ex:["I stayed home [[because it was raining]].","[[When I get home]], I usually take a shower.","[[If it's sunny tomorrow]], let's go hiking. (✗ If it will be)"]},
  {h:"A clause can be a 'thing'",p:"that / what / if + clause works like one big noun.",
   ex:["I think [[(that) he's right]].","I don't know [[what he wants]].","I'm not sure [[if it's open]].","[[What I need]] is a break."]},
  {h:"Question inside a sentence = normal order",p:"Once a question goes inside a sentence, it becomes subject + verb again.",
   ex:["Where is the station? → Do you know [[where the station is]]?","What time does it start? → Can you tell me [[what time it starts]]?"]},
  {h:"A clause can describe a noun",p:"This is the relative clause (see unit 8).",
   ex:["the guy [[who lives next door]]","the place [[where we met]]"]},
  {h:"How natives build long answers",p:"Main idea first. Then add: because…, so…, which…, but…, and then…",
   ex:["I love my neighborhood [[because it's quiet]], [[which is rare in Seoul]]."]}
 ],
 dialog:[["A","Do you know [[what time the store closes]]?"],["B","I'm not sure, but I think [[it closes at nine]]."],["A","[[If it's still open when we get there]], let's buy some snacks."],["B","Okay. [[Although I already ate]], I could eat again."],["A","Ha. [[What I really want]] is ice cream."],["B","Same. I'll text my sister to ask [[if she wants some]]."]],
 mistakes:[
  ["Do you know where is the bathroom?","Do you know where the bathroom is?","Inside a sentence → normal order."],
  ["When I will finish work, I'll call you.","When I finish work, I'll call you.","Future after when / if → present."],
  ["Although it was raining, but we went out.","Although it was raining, we went out.","Use one connector, not two."],
  ["I don't know what does he want.","I don't know what he wants.","No 'does' inside the sentence."]
 ],
 opic:"OPIc raters listen for connected speech (paragraphs = IH/AL). Practice: one clause → add because → add so → add which."
},
{id:"u8",no:8,ko:"관계사",en:"Name tags for nouns",pic:"tag",
 big:"A relative clause is a name tag on a noun. It tells you WHICH one, or adds extra information about it.",
 points:[
  {h:"who / that → people",p:"The clause tells you which person.",
   ex:["I have a friend [[who lives in Canada]].","The woman [[that helped me]] was so kind."]},
  {h:"which / that → things",p:"The clause tells you which thing.",
   ex:["The phone [[that I bought last week]] is already broken.","It's a song [[that always makes me cry]]."]},
  {h:"Drop it when a new subject follows",p:"If the next word is a new subject (I, you, he…), you can drop who/that. Natives usually do.",
   ex:["the movie [[(that) I watched]] yesterday","the person [[(who) I talked to]]","Everything [[I said]] was true."]},
  {h:"where / when → places and times",p:"For places use where. For times, natives often just drop when.",
   ex:["the café [[where we first met]]","the day [[(when) I got my license]]"]},
  {h:"whose = his / her / their",p:"Shows that something belongs to that person.",
   ex:["I have a friend [[whose dad is a pilot]]."]},
  {h:"what = the thing(s) that",p:"what already contains the noun. Don't say 'the thing what'.",
   ex:["[[What I want]] is some sleep.","That's not [[what I meant]].","Do [[what you love]]."]},
  {h:", which… = your comment on the whole sentence",p:"Super common in speech for adding your reaction at the end.",
   ex:["He didn't show up, [[which was really annoying]].","We got a free upgrade, [[which was nice]]."]},
  {h:"Preposition at the end (casual)",p:"In speech, the little word goes to the end.",
   ex:["the person [[I live with]]","the city [[I grew up in]]","something [[I'm interested in]]"]}
 ],

/* ───────── 저장 ───────── */
const LS="ttyEnglish.v1";
const today=()=>new Date().toLocaleDateString("sv-SE");
const addDays=(d,n)=>{const t=new Date(d+"T12:00:00");t.setDate(t.getDate()+n);return t.toLocaleDateString("sv-SE")};
const blank=()=>({v:1,updatedAt:0,xp:0,goal:100,days:{},read:{},qs:{},wrong:[],srs:{},mine:[]});
let S=blank();
try{const raw=localStorage.getItem(LS);if(raw)S=Object.assign(blank(),JSON.parse(raw))}catch(e){}
let remote=null,saveT=null,syncState="local";
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(remote){clearTimeout(saveT);saveT=setTimeout(pushRemote,1500)}}
let pushing=false,again=false;
async function pushRemote(){if(!remote)return;if(pushing){again=true;return}pushing=true;
  try{await remote.set(JSON.parse(JSON.stringify(S)));setSync("on")}catch(e){setSync("err")}
  pushing=false;if(again){again=false;pushRemote()}}
function setSync(s){syncState=s;const el=document.getElementById("sync");if(!el)return;
  el.className="sync"+(s==="on"?" on":"");el.textContent=s==="on"?"☁ 계정에 저장 중":s==="err"?"이 기기에만 저장됨":"이 기기에 저장"}
(async()=>{try{if(!window.claude?.use)return;const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!user||!db)return;const id=await user.id();if(!id)return;
  const ref=db.doc("data/users/"+id+"/state");const snap=await ref.get();remote=ref;
  if(snap.exists){const r=snap.data();if((r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}else if(S.updatedAt>(r.updatedAt||0))pushRemote()}
  else if(S.updatedAt)pushRemote();setSync("on")}catch(e){setSync("err")}})();

/* ───────── 도우미 ───────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<mark class="hl">$1</mark>');
const plain=s=>String(s).replace(/\[\[|\]\]/g,"");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const unitOf=id=>UNITS.find(u=>u.id===id);
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function pop(t,c){const d=document.createElement("div");d.className="pop "+c;d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),950)}
function gain(n,why){S.xp+=n;const d=today();S.days[d]=(S.days[d]||0)+n;save();refreshTop();if(why)pop("+"+n+" XP","b")}
function streak(){let n=0,d=today();if(!S.days[d])d=addDays(d,-1);while(S.days[d]){n++;d=addDays(d,-1)}return n}
const LEVELS=[["NL",0],["NM",100],["NH",300],["IL",600],["IM1",1000],["IM2",1600],["IM3",2400],["IH",3500],["AL",5000]];
function level(){let i=0;LEVELS.forEach((l,k)=>{if(S.xp>=l[1])i=k});return i}

/* 발음 듣기 (브라우저 음성) */
let VO=null;
const clean=t=>plain(t).replace(/[→✗✓]/g,". ").replace(/ \/ /g,". ");
function pickVoice(){const vs=speechSynthesis.getVoices();VO=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
const hasTTS="speechSynthesis" in window;
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,slow){if(!hasTTS){toast("이 브라우저는 읽어주기를 지원하지 않아요. 사전 링크로 들어 보세요.");return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(t));u.lang="en-US";if(VO)u.voice=VO;u.rate=slow?.72:.95;speechSynthesis.speak(u)}
const sayBtn=(t,slow=true)=>`<button class="say" data-say="${esc(plain(t))}" aria-label="원어민 발음 듣기">🔊</button>`+(slow?`<button class="say" data-say="${esc(plain(t))}" data-slow="1" aria-label="천천히 듣기">🐢</button>`:"");

/* 영영사전 · 실제 발음 링크 */
function dictLinks(t){const p=plain(t).trim();const w=p.split(/\s+/).length;const q=encodeURIComponent(p.toLowerCase().replace(/[.?!,]+$/,""));
  const L=[];if(w<=3){L.push(["Cambridge",`https://dictionary.cambridge.org/dictionary/english/${q.replace(/%20/g,"-")}`],["Oxford",`https://www.oxfordlearnersdictionaries.com/search/english/?q=${q}`],["Longman",`https://www.ldoceonline.com/search/english/direct/?q=${q}`])}
  L.push(["YouGlish 원어민 영상",`https://youglish.com/pronounce/${encodeURIComponent(p.replace(/[.?!]+$/,""))}/english/us`]);
  return `<div class="row">${L.map(([n,u])=>`<a class="btn sm ghost" href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join("")}</div>`}

/* 내 목소리 녹음 → 원어민과 비교 */
function recBox(t){return `<div class="rec card" style="padding:12px 14px;gap:8px;background:var(--bub);border:0">
  <div class="row" style="justify-content:space-between"><span class="lbl b">Shadowing · 따라 말하기</span>${sayBtn(t)}</div>
  <div class="row"><button class="btn sm" data-act="rec">🎙 녹음하기</button><label class="btn sm ghost">📱 녹음 앱으로<input type="file" accept="audio/*" data-act="recfile" hidden></label></div>
  <div class="recout row"></div>
  <p class="note" style="margin:0">원어민 → 내 목소리 → 원어민 순서로 번갈아 들어 보세요. 녹음은 이 화면에만 있고 저장되지 않아요.</p></div>`}
let mrec=null;
async function startRec(btn){const box=btn.closest(".rec"),out=box.querySelector(".recout");
  if(mrec&&mrec.state==="recording"){mrec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];mrec=new MediaRecorder(st);
    mrec.ondataavailable=e=>ch.push(e.data);
    mrec.onstop=()=>{st.getTracks().forEach(t=>t.stop());showRec(out,new Blob(ch,{type:mrec.mimeType}));btn.textContent="🎙 다시 녹음"};
    mrec.start();btn.textContent="⏹ 녹음 멈추기"}
  catch(e){out.innerHTML=`<p class="note" style="margin:0">이 화면에선 마이크를 바로 켤 수 없어요. 옆의 <b>📱 녹음 앱으로</b>를 누르면 휴대폰 녹음기가 열리고, 녹음을 마치면 여기서 바로 들을 수 있어요.</p>`}}
function showRec(out,blob){out.innerHTML="";const a=document.createElement("audio");a.controls=true;a.src=URL.createObjectURL(blob);a.style.width="100%";a.style.maxWidth="420px";out.append(a)}

/* ───────── Claude에게 묻기 ───────── */
let sampleP=null;
const getSample=()=>sampleP||(sampleP=(window.claude?.use?claude.use("sample"):Promise.resolve(null)).catch(()=>null));
let aiOff=false;
function aiErr(e){const c=e?.code;if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){aiOff=true;return "이 화면에서는 AI를 쓸 수 없어요. 아티팩트 메뉴의 권한에서 Claude 사용을 허용하면 켜집니다."}
  if(c==="rate_limited")return "AI 사용량이 잠깐 찼어요. 조금 뒤에 다시 눌러 주세요.";if(c==="session_expired")return "다시 로그인한 뒤 눌러 주세요.";if(c==="invalid_json")return "답이 깨져서 왔어요. 한 번 더 눌러 주세요.";if(c==="cancelled")return "";return "AI가 답을 못 했어요. 한 번 더 눌러 주세요."}
const RULE="Rules: Explain ONLY in simple English (CEFR A2-B1 words). Never write Korean, never translate into Korean. Focus on meaning, feeling, and when people really say it, not grammar terms. Use natural, spoken, American English.";
async function aiJSON(prompt,el){const s=await getSample();if(!s){el.innerHTML=`<p class="note">AI는 Claude 앱이나 claude.ai에서 열었을 때 켜져요.</p>`;return null}
  el.innerHTML=`<p class="note">Thinking… (보통 10~30초)</p>`;try{const r=await s.json(prompt,{modelTier:"default"});return r}catch(e){el.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`;return null}}
async function aiText(prompt,el){const s=await getSample();if(!s){el.textContent="AI는 Claude 앱이나 claude.ai에서 열었을 때 켜져요.";return}

 const head=`<div class="prog"><span>${SP.i+1} / ${SP.queue.length}</span><span>${c.tag?esc(unitOf(c.tag)?.ko||""):c.cat==="mine"?"내 문장":""}</span></div><div class="meter"><i style="width:${SP.i/SP.queue.length*100}%"></i></div>`;
 if(SP.mode==="rep"){spRep(c,head);return}
 const q=SP.mode==="situ"?`<div class="situ">${esc(c.situ)} ${sayBtn(c.situ,false)}</div>`:`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:12px"><div class="prompt-ko">${esc(c.ko)}</div>${SP.flash&&!SP.shown?`<svg class="ring" viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="22"/><circle class="fg" id="ringfg" cx="27" cy="27" r="22" stroke-dasharray="138.2" stroke-dashoffset="0" transform="rotate(-90 27 27)"/><text id="ringt" x="27" y="33" text-anchor="middle">5</text></svg>`:""}</div>`;
 $("#stage").innerHTML=`<section class="card flash">${head}${q}
  ${SP.shown?spReveal(c):`<textarea id="mine" rows="2" placeholder="소리 내서 말한 다음, 원하면 여기 적어 보세요 (안 적어도 돼요)"></textarea>
   <div class="row"><button class="btn pri grow" data-act="reveal">정답 보기</button><button class="btn ghost" data-act="skip">건너뛰기</button></div>`}</section>`;
 if(SP.flash&&!SP.shown&&SP.mode==="ko"){const t0=Date.now();flashT=setInterval(()=>{const e=(Date.now()-t0)/1000,l=Math.max(0,5-e);const fg=$("#ringfg"),tt=$("#ringt");if(!fg){clearInterval(flashT);return}fg.setAttribute("stroke-dashoffset",(138.2*(1-l/5)).toFixed(1));tt.textContent=Math.ceil(l);if(l<=0){clearInterval(flashT);SP.mineTxt=$("#mine")?.value||"";SP.shown=true;spCard()}},100)}}
function spReveal(c){const mine=SP.mineTxt||"";
 return `<div class="answer">${esc(c.en)}</div><div class="row">${sayBtn(c.en)}<button class="btn sm ghost" data-act="explain" data-t="${esc(c.en)}">영영 풀이</button></div>
  ${c.trap?`<div class="vs"><div class="kr"><span class="lbl">한국식 사고</span><p>${esc(c.trap)}</p></div><div class="eng"><span class="lbl g">영어식 사고</span><p>${esc(c.en)}</p></div></div>`:""}
  <div class="think"><span class="lbl b">Think in English</span>${esc(c.think)}</div>
  ${c.alt?`<p class="note en" style="margin:0;font-size:15px">Also: <b>${esc(c.alt)}</b> ${sayBtn(c.alt.replace(/\(.*?\)/g,""),false)}</p>`:""}
  ${mine?`<div class="ai" style="padding:12px"><div class="row" style="justify-content:space-between"><span class="note">내가 쓴 답: <b class="en" style="color:var(--ink)">${esc(mine)}</b></span><button class="btn blue sm" data-act="checkmine">AI로 검사</button></div><div id="chkout" class="res"></div></div>`:""}
  ${recBox(c.en)}
  ${dictLinks(c.en)}
  ${SP.mode==="ko"||SP.mode==="situ"?`<div class="rate"><button class="r0" data-rate="0">못 했어요<small>오늘 또</small></button><button class="r1" data-rate="1">생각했어요<small>내일 다시</small></button><button class="r2" data-rate="2">바로 나왔어요<small>나중에</small></button></div>`:""}`}
const BOX=[0,1,3,7,16,35];
function rate(r){const c=SP.queue[SP.i];const cur=S.srs[c.id]||{b:0};let b=r===2?Math.min(5,(cur.b||0)+1):r===1?Math.max(1,cur.b||0):0;
 if(!String(c.id).startsWith("qs"))S.srs[c.id]={b,d:addDays(today(),r===0?0:r===1?1:BOX[b])};
 if(r===0)SP.queue.push(c);gain([2,5,8][r],true);SP.i++;SP.shown=false;SP.mineTxt="";spCard()}
function spDone(){$("#stage").innerHTML=`<section class="card" style="align-items:flex-start"><span class="lbl g">끝!</span><div class="score">${SP.queue.length}<small> 장 완료</small></div><p class="muted" style="margin:0">오늘 ${S.days[today()]||0} XP. 방금 본 문장 중 하나를 오늘 실제로 써 보세요.</p><div class="row"><button class="btn pri" data-act="spagain">한 번 더</button><button class="btn ghost" data-go="home">오늘 화면</button></div></section>`}
async function spRep(c,head){const st=SP.step;const steps=["① 문장 통째로","② 대화 속에서","③ 짧은 글 속에서","④ 영어 상황 퀴즈"];
 let body="";
 if(!c.dlg&&st>0&&!c._ai){body=`<div class="ai"><div class="h"><span class="dot">C</span>이 문장은 아직 반복 자료가 없어요</div><button class="btn blue sm" data-act="mkreps">AI로 대화·글·상황 만들기</button><div id="repout"></div></div>`}
 else if(st===0)body=`<div class="answer">${esc(c.en)}</div><div class="row">${sayBtn(c.en)}</div><div class="think"><span class="lbl b">Think in English</span>${esc(c.think)}</div>${c.trap?`<div class="vs"><div class="kr"><span class="lbl">한국식 사고</span><p>${esc(c.trap)}</p></div><div class="eng"><span class="lbl g">영어식 사고</span><p>${esc(c.en)}</p></div></div>`:""}`;
 else if(st===1)body=`<div class="chat">${c.dlg.map(([w,t])=>`<div class="bub ${w}"><span class="who">${w}</span><span class="txt">${esc(t).replace(esc(c.en.replace(/[.?!]$/,"")),m=>`<mark class="hl">${m}</mark>`)}</span>${sayBtn(t,false)}</div>`).join("")}</div>`;
 else if(st===2)body=`<div class="para">${esc(c.para).replace(esc(c.en.replace(/[.?!]$/,"")),m=>`<mark class="hl">${m}</mark>`)}</div><div class="row">${sayBtn(c.para)}</div>${c.more?`<div class="more"><span class="lbl b">Same shape, other situations</span>${c.more.map(m=>`<div class="row"><span class="en" style="flex:1">${esc(m)}</span>${sayBtn(m.replace(/\(.*?\)/g,""),false)}</div>`).join("")}</div>`:""}`;
 else body=`<div class="situ">${esc(c.situ)} ${sayBtn(c.situ,false)}</div>${SP.shown?`<div class="answer">${esc(c.en)}</div>${recBox(c.en)}`:`<p class="note" style="margin:0">소리 내서 말해 본 다음 정답을 확인하세요.</p>`}`;
 const nextLbl=st<3?"다음 →":SP.shown?"이 표현 완료 ✓":"정답 보기";
 $("#stage").innerHTML=`<section class="card flash">${head}<div class="stepper">${steps.map((s,i)=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div><span class="lbl b">${steps[st]}</span>${body}
  <div class="row">${st>0?`<button class="btn ghost" data-act="repprev">← 이전</button>`:""}${(c.dlg||st===0)?`<button class="btn pri grow" data-act="repnext">${nextLbl}</button>`:""}<button class="btn ghost" data-act="repskip">건너뛰기</button></div></section>`}

let QZ={u:"all",kind:"normal",list:[],i:0,ans:null,right:0,hp:100,hearts:3,combo:0,wrongs:[]};
const TL={pick:"빈칸",mean:"무슨 뜻?",fix:"자연스러운 문장",situ:"영어 상황"};
VIEWS.quiz=arg=>{if(arg&&arg!=="wrong")QZ.u=arg;const cnt=u=>u==="all"?QUIZ.length:QUIZ.filter(q=>q.u===u).length;
 $("#stage").innerHTML=`<section class="card"><div class="sec-h"><h2>문법 퀴즈</h2><span class="note">뜻에 집중한 문제예요</span></div>

  </div><button class="btn pri" data-act="qstart">시작하기</button></section>
  ${S.wrong.length?`<section class="card"><span class="lbl">오답노트 미리보기</span><div class="wlist">${S.wrong.slice(-4).reverse().map(i=>`<div class="wli">${esc(QUIZ[i].q)}\n<span class="a">→ ${esc(QUIZ[i].o[0])}</span></div>`).join("")}</div></section>`:""}`};
function qStart(){let pool=QUIZ.map((q,i)=>i);if(QZ.kind==="wrong"){pool=S.wrong.slice();if(!pool.length){toast("오답노트가 비어 있어요. 멋져요!");return}}else if(QZ.u!=="all")pool=pool.filter(i=>QUIZ[i].u===QZ.u);
 pool=shuffle(pool);QZ.list=QZ.kind==="boss"?pool.concat(shuffle(pool)):pool.slice(0,10);Object.assign(QZ,{i:0,ans:null,right:0,hp:100,hearts:3,combo:0,wrongs:[],opts:null});qCard()}
function qCard(){const qi=QZ.list[QZ.i];if(qi===undefined||(QZ.kind==="boss"&&(QZ.hp<=0||QZ.hearts<=0))){qDone();return}
 const q=QUIZ[qi];if(!QZ.opts)QZ.opts=shuffle(q.o.map((t,k)=>({t,k})));const a=QZ.ans;
 const boss=QZ.kind==="boss"?`<div class="boss" id="boss"><div class="bossface ${QZ.hp<=0?"dead":""}">N</div><div class="bossinfo"><span class="nm">The Native Speaker</span><div class="bhp"><i style="width:${QZ.hp}%"></i></div><div class="row" style="justify-content:space-between"><span class="hearts">${"♥".repeat(QZ.hearts)}<s>${"♥".repeat(3-QZ.hearts)}</s></span><span class="combo">${QZ.combo>1?QZ.combo+" COMBO!":""}</span></div></div></div>`:"";
 const quote=q.t==="mean";
 $("#stage").innerHTML=`${boss}<section class="card qcard"><div class="prog"><span>${QZ.kind==="boss"?"보스전":QZ.kind==="wrong"?"오답노트":"퀴즈"} · ${QZ.i+1}${QZ.kind==="boss"?"":" / "+QZ.list.length}</span><span><span class="qtype">${TL[q.t]}</span> ${esc(unitOf(q.u).ko)}</span></div>
  ${QZ.kind!=="boss"?`<div class="meter"><i style="width:${QZ.i/QZ.list.length*100}%"></i></div>`:""}
  ${quote?`<p class="note" style="margin:0">What does this mean?</p>`:""}<div class="qtxt ${quote?"quote":""}">${esc(q.q)}</div>
  <div class="opts">${QZ.opts.map((o,n)=>`<button class="opt ${a!==null?(o.k===0?"right":n===a?"wrong":""):""}" data-opt="${n}" ${a!==null?"disabled":""}><span class="dot">${"ABCD"[n]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
  ${a!==null?`<div class="why"><span class="v ${QZ.opts[a].k===0?"ok":"ng"}">${QZ.opts[a].k===0?"정답!":"아쉬워요"}</span><div class="think"><span class="lbl b">Why</span>${esc(q.x)}</div>
   <div class="row">${sayBtn(q.t==="pick"?q.q.replace("___",q.o[0]).replace(/^[AB]: /gm,""):q.t==="mean"?q.q:q.o[0])}<button class="btn sm ghost" data-act="explain" data-t="${esc(q.t==="mean"?q.q:q.o[0])}">영영 풀이</button></div>
   <button class="btn pri" data-act="qnext">${QZ.kind!=="boss"&&QZ.i+1>=QZ.list.length?"결과 보기":"다음 문제 →"}</button></div>`:""}</section>`}
function qAnswer(n){if(QZ.ans!==null)return;QZ.ans=n;const qi=QZ.list[QZ.i];const ok=QZ.opts[n].k===0;const s=S.qs[qi]||{c:0,w:0};
 if(ok){s.c++;QZ.right++;QZ.combo++;S.wrong=S.wrong.filter(x=>x!==qi);if(QZ.kind==="boss")QZ.hp=Math.max(0,QZ.hp-(8+Math.min(QZ.combo,5)*2));gain(10,true)}
 else{s.w++;QZ.combo=0;QZ.wrongs.push(qi);if(!S.wrong.includes(qi))S.wrong.push(qi);if(QZ.kind==="boss")QZ.hearts--;pop("✗","r")}
 S.qs[qi]=s;save();qCard();if(!ok)$(".qcard")?.classList.add("shake")}
function qDone(){const boss=QZ.kind==="boss",win=boss&&QZ.hp<=0;if(win)gain(50,true);
 $("#stage").innerHTML=`<section class="card" style="align-items:flex-start"><span class="lbl ${win||!boss?"g":""}">${boss?(win?"보스 격파!":"보스 승리… 다시 도전!"):"결과"}</span>
  <div class="score">${QZ.right}<small> / ${boss?QZ.i:QZ.list.length} 정답</small></div>${win?`<p class="muted" style="margin:0">보너스 +50 XP</p>`:""}
  ${QZ.wrongs.length?`<span class="lbl">틀린 문제 (오답노트에 들어갔어요)</span><div class="wlist" style="align-self:stretch">${QZ.wrongs.map(i=>`<div class="wli">${esc(QUIZ[i].q)}\n<span class="a">→ ${esc(QUIZ[i].o[0])}</span>\n<span class="muted">${esc(QUIZ[i].x)}</span></div>`).join("")}</div>`:`<p class="muted" style="margin:0">하나도 안 틀렸어요!</p>`}
  <div class="row"><button class="btn pri" data-act="qstart">다시 하기</button><button class="btn ghost" data-go="quiz">퀴즈 목록</button></div></section>`}

  <textarea id="cin" rows="3" placeholder="${{say:"예: 집이 좀 누추하지? / 나 요즘 운동에 꽂혔어",explain:"예: swamped / I'm good with water / wouldn't hurt",check:"예: I'm studying English since last year.",examples:"내 상황: 예) 우리 강아지, 회사 회식, 제주 여행"}[CM]}"></textarea>

   ${S.mine.length?`<div class="mylist">${S.mine.slice().reverse().map(p=>`<div class="my"><div class="body"><span class="en">${esc(p.en)}</span>${p.ko?`<span class="ko">${esc(p.ko)}</span>`:""}<span class="tk">${esc(p.think||"")}</span></div>${sayBtn(p.en,false)}<button class="x-del" data-del="${p.id}" aria-label="삭제">삭제</button></div>`).join("")}</div>`:`<p class="empty">‘이 말 영어로’에서 저장한 문장이 여기 모여요. 하고 싶은 말을 전부 영어로 만들어 쌓아 보세요.</p>`}</section>`};

 selBtn.dataset.t=t;selBtn.dataset.act="explain";selBtn.style.top=(window.scrollY+r.bottom+8)+"px";selBtn.style.left=Math.max(8,Math.min(window.scrollX+r.left,window.scrollX+innerWidth-150))+"px"},250)});
function openSheet(t){closeSheet();const d=document.createElement("div");d.className="sheet";d.id="sheet";d.innerHTML=`<div class="in"><div class="row" style="justify-content:space-between"><span class="lbl b">Think in English · 영영 풀이</span><button class="btn sm ghost" data-act="closesheet">닫기 ✕</button></div><div id="sout" class="res"></div></div>`;document.body.append(d);
 aiJSON(P.explain(t),$("#sout")).then(r=>{if(r)renderExplain(r,$("#sout"));else $("#sout").insertAdjacentHTML("beforeend",`<div class="main en">${esc(t)}</div><div class="row">${sayBtn(t)}</div>${dictLinks(t)}`)})}
function closeSheet(){$("#sheet")?.remove()}

/* ───────── 클릭 처리 ───────── */
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-act]");if(!b)return;const d=b.dataset;
 if(d.say!==undefined){speak(d.say,d.slow);return}
 if(d.tab){go(d.tab);return}
 if(d.go){if(d.go==="unit")go("unit",d.arg);else go(d.go,d.arg);return}
 if(d.goal){S.goal=+d.goal;save();render();return}
 if(d.sp){SP.mode=d.sp;VIEWS.speak();return}
 if(d.cat){SP.cat=d.cat;VIEWS.speak();return}
 if(d.qu){QZ.u=d.qu;VIEWS.quiz();return}
 if(d.qk){QZ.kind=d.qk;VIEWS.quiz();return}
 if(d.opt!==undefined){qAnswer(+d.opt);return}
 if(d.rate!==undefined){rate(+d.rate);return}
 if(d.cm){CM=d.cm;VIEWS.coach();return}
 if(d.exu){window._exu=d.exu;document.querySelectorAll("[data-exu]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.exu===d.exu));return}
 if(d.del){S.mine=S.mine.filter(m=>m.id!==d.del);delete S.srs[d.del];save();VIEWS.coach();return}
 const A=d.act;if(!A)return;
 if(A==="explain"){selBtn?.remove();selBtn=null;openSheet(d.t);return}
 if(A==="closesheet"){closeSheet();return}
 if(A==="rec"){startRec(b);return}
 if(A==="read"){if(!S.read[d.u]){S.read[d.u]=today();gain(20,true)}VIEWS.unit(d.u);return}
 if(A==="playdlg"){const u=unitOf(d.u);if(!u||!hasTTS)return;speechSynthesis.cancel();u.dialog.forEach(([w,t],i)=>{const x=new SpeechSynthesisUtterance(clean(t));x.lang="en-US";const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));x.voice=(w==="B"&&vs[1])?vs[1]:VO;x.rate=.95;speechSynthesis.speak(x)});return}
 if(A==="mkex"){const u=unitOf(d.u);aiJSON(P.examples(u,$("#extopic").value.trim()),$("#exout")).then(r=>renderExamples(r,$("#exout")));return}
 if(A==="ask"){const q=$("#askq").value.trim();if(!q){$("#askq").focus();return}aiText(P.ask(unitOf(d.u),q),$("#askout"));return}
 if(A==="spstart"){SP.flash=!!$("#flash")?.checked;buildQueue();if(!SP.queue.length){toast(SP.cat==="mine"?"아직 저장한 내 문장이 없어요. AI 코치에서 만들어 보세요.":"이 묶음은 오늘 볼 카드가 없어요.");return}spCard();return}
 if(A==="reveal"){SP.mineTxt=$("#mine")?.value.trim()||"";SP.shown=true;spCard();return}
 if(A==="skip"){SP.i++;SP.shown=false;spCard();return}
 if(A==="spagain"){buildQueue();spCard();return}
 if(A==="checkmine"){const c=SP.queue[SP.i];aiJSON(P.check(SP.mineTxt,c.ko,c.en),$("#chkout")).then(r=>renderCheck(r,$("#chkout")));return}
 if(A==="repnext"){const c=SP.queue[SP.i];if(SP.step<3){SP.step++;SP.shown=false;spCard()}else if(!SP.shown){SP.shown=true;spCard()}else{gain(15,true);SP.i++;SP.step=0;SP.shown=false;spCard()}return}
 if(A==="repskip"){SP.i++;SP.step=0;SP.shown=false;spCard();return}
 if(A==="repprev"){SP.step=Math.max(0,SP.step-1);SP.shown=false;spCard();return}
 if(A==="mkreps"){const c=SP.queue[SP.i];aiJSON(P.reps(c.en,c.think),$("#repout")).then(r=>{if(r&&Array.isArray(r.dlg)&&r.para&&r.situ){Object.assign(c,{dlg:r.dlg,para:r.para,situ:r.situ,more:r.more||[],_ai:true});spCard()}});return}
 if(A==="qstart"){qStart();return}
 if(A==="qnext"){QZ.i++;QZ.ans=null;QZ.opts=null;qCard();return}
 if(A==="coachgo"){const t=$("#cin").value.trim(),el=$("#cout");if(!t){$("#cin").focus();return}
  if(CM==="say")aiJSON(P.say(t),el).then(r=>renderSay(r,t,el));
  else if(CM==="explain")aiJSON(P.explain(t),el).then(r=>renderExplain(r,el));
  else if(CM==="check")aiJSON(P.check(t),el).then(r=>renderCheck(r,el));
  else aiJSON(P.examples(unitOf(window._exu||"u1"),t),el).then(r=>renderExamples(r,el));return}
 if(A==="savesay"){const l=window._lastSay;if(!l)return;if(S.mine.some(m=>m.en===l.en)){toast("이미 저장했어요");return}
  S.mine.push(Object.assign({id:"m"+Date.now().toString(36)},l));if(S.mine.length>400)S.mine.shift();gain(5,true);toast("내 문장에 저장했어요. 말하기 ‘내 문장’에서 연습할 수 있어요.");b.disabled=true;b.textContent="✓ 저장됨";
  const list=document.querySelector(".mylist");if(!list)VIEWS.coach();return}
});
document.addEventListener("change",e=>{const f=e.target;if(f.dataset?.act==="recfile"&&f.files[0]){showRec(f.closest(".rec").querySelector(".recout"),f.files[0]);f.value=""}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* 시작 */
const H=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===H))MODE=H;
render();
</script>
