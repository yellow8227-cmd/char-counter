<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#14110f;overflow:hidden;
       font-family:'Liberation Sans','DejaVu Sans',sans-serif;color:#fff;position:relative}
  /* 옅은 격자 — 「랩(실험실)」의 모눈종이 */
  .grid{position:absolute;inset:0;opacity:.055;
        background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
        background-size:60px 60px}
  .glow{position:absolute;width:900px;height:900px;left:-260px;top:-380px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,196,0,.20) 0%,rgba(255,196,0,0) 62%)}
  .in{position:absolute;inset:0;padding:76px 88px;display:flex;flex-direction:column}
  .top{flex:1;display:flex;flex-direction:column;justify-content:center}
  .mark{display:flex;align-items:center;gap:26px}
  .dot{width:46px;height:46px;border-radius:50%;background:#ffc400;flex:none;
       box-shadow:0 0 60px rgba(255,196,0,.55)}
  .wm{font-size:112px;font-weight:700;letter-spacing:.055em;line-height:1}
  .sub{margin-top:34px;font-size:30px;letter-spacing:.045em;color:#b9b0a6;font-weight:400}
  .rule{width:150px;height:5px;background:#ffc400;margin-top:46px}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
  .items{display:flex;gap:14px}
  .items span{border:2px solid #3b342d;border-radius:999px;padding:12px 22px;
              font-size:21px;letter-spacing:.085em;color:#e6ded4;white-space:nowrap}
  .url{font-size:20px;letter-spacing:.09em;color:#7d746a;white-space:nowrap;padding-bottom:6px}
</style></head><body>
  <div class="grid"></div><div class="glow"></div>
  <div class="in">
    <div class="top">
      <div class="mark"><span class="dot"></span><span class="wm">YELLOW LAB</span></div>
      <p class="sub">CHUNG JOOWON &nbsp;·&nbsp; CONTENT PLANNER</p>
      <div class="rule"></div>
    </div>
    <div class="row">
      <div class="items">
        <span>SCENEDECK</span><span>SHOT PLANNER</span><span>JELLY SHOOTING</span>
      </div>
      <div class="url">yellow8227-cmd.github.io</div>
    </div>
  </div>
</body></html>
