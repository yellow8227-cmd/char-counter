<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- 없는 주소로 들어왔을 때 보여 주는 쪽입니다.
     생김새는 홈과 같은 토큰을 쓰므로 홈의 <style> 을 그대로 복사해 둡니다.
     홈의 색이나 글꼴을 바꾸면 이 파일도 같이 바꿔야 합니다.
<!--
     고칠 곳은 네 군데뿐입니다. 파일에서 ① ② ③ ④ 를 찾으세요.
       ① SITE    이 페이지 주소 (미리보기 카드 · 검색용)
       ② NOTION  포트폴리오 노션 주소
       ③ GAME    젤리슈팅 주소
       ④ CHANNEL 블로그 · 인스타그램 주소
     도구 화면을 다시 찍으려면 brand/shots/ 의 그림을 바꾸면 됩니다.
     마크를 새로 그리면 brand/mark.svg 와 아래 <symbol id="yg"> 를 함께 바꾸세요.
     ══════════════════════════════════════════════════════════════════ -->

<title>없는 쪽입니다 — 옐로우그로브</title>
<meta name="author" content="정주원">

<!-- ①SITE -->
<!-- ①SITE -->
<!-- ①SITE -->

<meta name="theme-color" content="#ffc400">
<link rel="icon" href="brand/mark.svg" type="image/svg+xml">
<link rel="icon" href="brand/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Gothic+A1:wght@300;400;500;700&family=Gowun+Batang:wght@400;700&display=swap">


<script>
// 저장해 둔 선택이 있으면 그림 그리기 전에 미리 붙인다. 안 그러면 밝은 화면이
// 한 번 번쩍이고 어두워진다.
try{var t=localStorage.getItem('yg-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<style>
/* ══ 토큰 ══ 브랜드 노트에서 그대로. 노랑은 #FFC400 하나뿐이고 아껴 쓴다. */
:root{
  --ground:#f2f1ee; --plate:#fbfaf8; --tint:#e9e7e3;
  --ink:#121110; --ink-2:#4e483f; --ink-3:#6e665c; --hair:#dcd8d1;
  --ink-hover:#332d26; --card-hover:#ffffff; --top-bg:rgba(242,241,238,.9);
  --yellow:#ffc400; --ember:#f38200;
  --hl:#ffc400; --hl-ink:#121110;
  /* 브라우저 창 목업 */
  --chrome:#eceae6; --chrome-line:rgba(18,17,16,.1); --chrome-edge:rgba(18,17,16,.16);
  --chrome-dot:rgba(18,17,16,.18); --chrome-url:#ffffff; --chrome-text:#6b6359;
  --dot-off:rgba(18,17,16,.22);
  /* 브랜드 띠 — 페이지에서 한 번만 쓰는 «센 자리».
     밝은 화면에서는 검은 바탕에 노란 마크, 어두운 화면에서는 뒤집어 노란 바탕에 검은 마크. */
  --band:#131110; --band-ink:#f7f4ee; --band-ink-2:#b9b0a5; --band-ink-3:#8b8278;
  --band-hair:#2c2925; --band-accent:#ffc400; --band-panel:#ffc400; --band-panel-ink:#131110;
  --display:'Gowun Batang',ui-serif,Georgia,serif;
  --sans:'Gothic A1',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --latin:'Archivo',var(--sans);
  --col:min(1180px,100% - 44px);
  --lift:0 2px 6px rgba(18,17,16,.06),0 22px 60px rgba(18,17,16,.13);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131110; --plate:#1c1a17; --tint:#191714;
  --ink:#f4f1ec; --ink-2:#c0b7ab; --ink-3:#9b9285; --hair:#2f2b26;
  --ink-hover:#e6dfd4; --card-hover:#232019; --top-bg:rgba(19,17,16,.88);
  --hl:transparent; --hl-ink:#ffc400;
  --chrome:#2a2622; --chrome-line:rgba(255,255,255,.08); --chrome-edge:rgba(255,255,255,.13);
  --chrome-dot:rgba(255,255,255,.2); --chrome-url:#171512; --chrome-text:#a49a8d;
  --dot-off:rgba(255,255,255,.26);
  --band:#ffc400; --band-ink:#1a1200; --band-ink-2:#4e3900; --band-ink-3:#6b5100;
  --band-hair:rgba(26,18,0,.2); --band-accent:#1a1200; --band-panel:#131110; --band-panel-ink:#ffc400;
  --lift:0 2px 6px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.44);
}}
:root[data-theme="dark"]{
  --ground:#131110; --plate:#1c1a17; --tint:#191714;
  --ink:#f4f1ec; --ink-2:#c0b7ab; --ink-3:#9b9285; --hair:#2f2b26;
  --ink-hover:#e6dfd4; --card-hover:#232019; --top-bg:rgba(19,17,16,.88);
  --hl:transparent; --hl-ink:#ffc400;
  --chrome:#2a2622; --chrome-line:rgba(255,255,255,.08); --chrome-edge:rgba(255,255,255,.13);
  --chrome-dot:rgba(255,255,255,.2); --chrome-url:#171512; --chrome-text:#a49a8d;
  --dot-off:rgba(255,255,255,.26);
  --band:#ffc400; --band-ink:#1a1200; --band-ink-2:#4e3900; --band-ink-3:#6b5100;
  --band-hair:rgba(26,18,0,.2); --band-accent:#1a1200; --band-panel:#131110; --band-panel-ink:#ffc400;
  --lift:0 2px 6px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.44);
}
:root{color-scheme:light dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-weight:300;font-size:16.5px;line-height:1.82;letter-spacing:-.008em;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
p{margin:0 0 18px}
img,svg{display:block;max-width:100%}
.col{width:var(--col);margin-inline:auto}
:focus-visible{outline:2px solid var(--ember);outline-offset:4px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--ground);padding:12px 18px;z-index:200}
.skip:focus{left:8px;top:8px}
.mark{width:var(--d,22px);height:var(--d,22px);flex:none}
.eyebrow{font-family:var(--latin);font-size:11px;font-weight:600;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 20px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.24;
  letter-spacing:-.035em;margin:0 0 18px;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%);color:var(--hl-ink)}
.lede{font-size:17px;color:var(--ink-2);max-width:38em;margin:0 0 clamp(34px,5vw,54px)}

/* ══ 머리말 ══ */
.top{position:sticky;top:0;z-index:60;background:var(--top-bg);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--hair)}
.top .col{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-family:var(--latin);
  font-weight:700;font-size:13.5px;letter-spacing:.17em;white-space:nowrap;padding:8px 0}
.top nav{margin-left:auto;display:flex;align-items:center;gap:24px}
.top nav a{text-decoration:none;font-size:14.5px;font-weight:500;color:var(--ink-2);padding:10px 2px}
.top nav a:hover{color:var(--ink)}
.top .cta{background:var(--ink);color:var(--ground)!important;padding:11px 19px;border-radius:2px;
  font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.top .cta:hover{background:var(--ink-hover)}
.theme{width:42px;height:42px;border-radius:2px;border:1px solid var(--hair);background:transparent;
  color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;
  font-family:inherit;transition:.14s;flex:none}
.theme:hover{border-color:var(--ink);color:var(--ink)}
@media(max-width:820px){.top nav a.hide-sm{display:none}.top .col{height:60px;gap:14px}}
/* 폰에서는 머리말이 넘친다. 이름을 감추고 마크만 남긴다 —
   화면에서만 사라지고 읽어 주는 기계에는 그대로 있다. */
@media(max-width:560px){
  .top .brand .wm{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .top .brand{padding:8px 7px;margin-left:-7px}
  .top .brand .mark{--d:28px}
  .top .cta{padding:11px 15px}
}

/* ══ 표제 ══ */
.hero{padding:clamp(52px,7vw,96px) 0 clamp(40px,5vw,68px)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
  gap:clamp(28px,5vw,60px);align-items:center}
h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,6.6vw,72px);line-height:1.16;
  letter-spacing:-.04em;margin:0 0 22px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--hl) 58%);color:var(--hl-ink);padding:0 .04em}
.hero p{max-width:34em;color:var(--ink-2);font-size:17px}
.hero p strong{color:var(--ink);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:11px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:500;font-size:15.5px;
  padding:14px 26px;border-radius:2px;border:1px solid var(--ink);transition:.15s;background:transparent;
  color:var(--ink);font-family:inherit;cursor:pointer}
.btn-fill{background:var(--ink);color:var(--ground)}
.btn-fill:hover{background:var(--ink-hover);border-color:var(--ink-hover)}
.btn-line:hover{background:var(--plate)}
.btn .arw{transition:transform .15s}
.btn:hover .arw{transform:translateX(3px)}
.hero-art{background:var(--yellow);aspect-ratio:1;display:grid;place-items:center;border-radius:2px}
.hero-art .mark{--d:min(58%,214px);color:#131110}
@media(max-width:880px){.hero-in{grid-template-columns:1fr}
  .hero-art{aspect-ratio:16/7;order:-1;margin-bottom:10px}.hero-art .mark{--d:106px}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair);margin-top:clamp(38px,5vw,60px)}
.stats div{padding:24px 22px 4px;border-right:1px solid var(--hair)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,42px);
  line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.stats b span{font-family:var(--sans);font-size:17px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.stats p{margin:10px 0 0;font-size:13.5px;color:var(--ink-3)}
@media(max-width:680px){.stats{grid-template-columns:1fr}
  .stats div{border-right:0;border-bottom:1px solid var(--hair);padding-bottom:20px}
  .stats div:last-child{border-bottom:0}}

/* ══ 슬라이드 ══ 도구를 한 장씩 넘겨 본다.
   가로 스크롤 + scroll-snap 이라 폰에서는 손가락으로 그냥 밀면 된다.
   화살표 단추는 그 스크롤을 대신 움직여 줄 뿐이라 둘이 항상 같은 상태다. */
.work{padding:clamp(60px,8vw,104px) 0 clamp(50px,7vw,84px);
  border-top:1px solid var(--hair);background:var(--tint)}
.work-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(26px,4vw,40px)}
.work-head .lede{margin-bottom:0}
.nav-btns{display:flex;gap:8px;margin-left:auto}
.nav-btns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);
  background:transparent;color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;
  transition:.14s;font-family:inherit}
.nav-btns button:hover:not(:disabled){background:var(--ink);color:var(--ground)}
.nav-btns button:disabled{opacity:.3;cursor:default}
.track{display:flex;gap:clamp(16px,2.4vw,26px);overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:4px;margin-inline:calc(50% - 50vw);
  padding-inline:max(22px,calc(50vw - var(--col)/2))}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(1180px,calc(100vw - 44px));scroll-snap-align:center;
  background:var(--plate);border:1px solid var(--hair);border-radius:3px;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.slide .stage{position:relative;padding:clamp(26px,3.4vw,44px);display:flex;align-items:center;
  justify-content:center;min-height:clamp(260px,32vw,400px);overflow:hidden}
.slide .body{padding:clamp(28px,3.6vw,48px);display:flex;flex-direction:column;justify-content:center;
  border-left:1px solid var(--hair)}
@media(max-width:900px){.slide{grid-template-columns:1fr}
  .slide .body{border-left:0;border-top:1px solid var(--hair)}}

/* 기기 목업 — 브라우저 창 뒤, 폰 앞 */
.device{position:relative;width:100%;max-width:560px}
.browser{border:1px solid var(--chrome-edge);border-radius:8px;overflow:hidden;
  background:var(--plate);box-shadow:var(--lift)}
.browser .bar{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--chrome);
  border-bottom:1px solid var(--chrome-line)}
.browser .bar i{width:8px;height:8px;border-radius:50%;background:var(--chrome-dot);flex:none}
.browser .bar span{margin-left:8px;font-family:var(--latin);font-size:9.5px;color:var(--chrome-text);
  background:var(--chrome-url);border-radius:20px;padding:3px 11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.browser img{width:100%;height:auto;display:block}
.phone{position:absolute;right:-10px;bottom:-22px;width:clamp(88px,14%,120px);
  border-radius:16px;padding:5px;background:#17150f;box-shadow:var(--lift)}
.phone img{width:100%;height:auto;display:block;border-radius:11px}
@media(max-width:520px){.phone{width:78px;right:-6px;bottom:-16px}}

.slide .label{font-family:var(--latin);font-size:10.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;display:flex;align-items:center;gap:9px}
.slide .label i{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex:none}
.slide h3{margin:0 0 4px;font-family:var(--sans);font-weight:700;font-size:clamp(24px,3.2vw,32px);
  letter-spacing:-.035em;line-height:1.24}
.slide .en{margin:0 0 18px;font-family:var(--latin);font-size:11px;font-weight:600;
  letter-spacing:.16em;color:var(--ink-3)}
.slide .body>p{margin:0 0 20px;color:var(--ink-2);font-size:15.5px;line-height:1.78}
/* 도구를 소개하기 전에 «무엇이 아쉬웠는지»를 먼저 말한다.
   해결책보다 문제를 먼저 두면 왜 만들었는지가 저절로 설명된다. */
.slide .why{margin:0 0 16px;padding-left:15px;border-left:2px solid var(--yellow);
  font-family:var(--display);font-size:16px;line-height:1.6;color:var(--ink);letter-spacing:-.02em}
.feat{list-style:none;margin:0 0 26px;padding:0;display:flex;flex-direction:column;gap:9px}
.feat li{position:relative;padding-left:19px;font-size:14.5px;color:var(--ink-2);line-height:1.65}
.feat li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:1px;background:var(--ink-3)}
.feat li b{color:var(--ink);font-weight:500}
.dots{display:flex;justify-content:center;margin-top:clamp(14px,2vw,22px)}
/* 보이는 점은 작지만 눌리는 범위는 44px 이라야 손가락으로 눌린다 */
.dots button{width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center}
.dots button::before{content:"";width:9px;height:9px;border-radius:50%;
  background:var(--dot-off);transition:.15s}
.dots button[aria-current="true"]::before{background:var(--ink);width:26px;border-radius:20px}

/* ══ 기획과 채널 ══ */
.more{padding:clamp(60px,8vw,104px) 0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.card{background:var(--plate);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:30px 28px 28px;display:flex;flex-direction:column;text-decoration:none;
  transition:background .14s;min-height:238px}
.card:hover{background:var(--card-hover)}
.card .label{font-family:var(--latin);font-size:10.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;display:flex;align-items:center;gap:9px}
.card .label i{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex:none}
.card h3{margin:0 0 4px;font-weight:700;font-size:21px;letter-spacing:-.03em;line-height:1.32}
.card .en{margin:0 0 13px;font-family:var(--latin);font-size:10.5px;font-weight:600;
  letter-spacing:.15em;color:var(--ink-3)}
.card p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.74}
.card .meta{margin-top:11px;font-size:12.5px;color:var(--ink-3)}
.card .go{margin-top:auto;padding-top:20px;font-size:14.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:8px}
.card .go .arw{transition:transform .15s}
.card:hover .go .arw{transform:translateX(4px)}
@media(max-width:900px){.cards{grid-template-columns:1fr}.card{min-height:0;padding:26px 22px 24px}}

/* 글자수 세기 */
.mini{margin-top:clamp(26px,4vw,40px);background:var(--plate);border:1px solid var(--hair);
  border-radius:3px;padding:clamp(26px,3.4vw,40px);display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(22px,3.4vw,44px);align-items:center}
@media(max-width:760px){.mini{grid-template-columns:1fr}}
.mini h3{margin:0 0 4px;font-weight:700;font-size:21px;letter-spacing:-.03em}
.mini .en{margin:0 0 13px;font-family:var(--latin);font-size:10.5px;font-weight:600;
  letter-spacing:.15em;color:var(--ink-3)}
.mini p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.74}
.mini textarea{width:100%;min-height:104px;resize:vertical;padding:13px 15px;
  border:1px solid var(--hair);border-radius:2px;font-family:inherit;font-size:15px;
  line-height:1.7;color:var(--ink);background:var(--ground)}
.mini textarea:focus{border-color:var(--ink-3);background:#fff;outline:none}
.counts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.counts span{font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--ground);
  border:1px solid var(--hair);border-radius:2px;padding:6px 11px;font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-weight:700}

/* ══ 소개 ══ */
.about{padding:clamp(60px,8vw,110px) 0;background:var(--tint);border-top:1px solid var(--hair)}
.about-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(30px,5vw,60px);align-items:start}
.about .who{margin:0 0 16px;font-size:15.5px;color:var(--ink-2);line-height:1.85}
.tl{margin:0;padding:0;list-style:none;border-top:1px solid var(--hair)}
.tl li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;padding:16px 0;border-bottom:1px solid var(--hair)}
.tl .yr{font-family:var(--latin);font-size:12px;font-weight:600;color:var(--ink-3);
  font-variant-numeric:tabular-nums;padding-top:5px}
.tl b{display:block;font-weight:500;font-size:15.5px;letter-spacing:-.02em;margin-bottom:2px}
.tl span{font-size:14px;color:var(--ink-2);line-height:1.7}
@media(max-width:880px){.about-in{grid-template-columns:1fr}.tl li{grid-template-columns:1fr;gap:3px}}

/* ══ 연락 ══ */
.contact{padding:clamp(60px,8vw,110px) 0}
.contact p{max-width:38em;color:var(--ink-2);font-size:16.5px;margin-bottom:30px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:500;font-size:15px;
  border:1px solid var(--hair);background:var(--plate);border-radius:2px;padding:13px 20px;transition:.14s}
.links a:hover{border-color:var(--ink);background:#fff}


/* ══ 브랜드 정체성 ══ 어두운 띠 하나로 끊어 준다.
   검은 바탕에 노란 마크가 이 브랜드의 가장 센 모습이라 여기에 쓴다. */
.brand-sec{background:var(--band);color:var(--band-ink);padding:clamp(64px,9vw,116px) 0}
.brand-sec .eyebrow{color:var(--band-ink-3)}
.brand-sec h2{color:var(--band-ink)}
.brand-sec h2 em{background:none;color:var(--band-accent)}
.brand-sec .lede{color:var(--band-ink-2)}
.rules{list-style:none;margin:0 0 clamp(30px,4.5vw,52px);padding:0;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--band-hair);
  border:1px solid var(--band-hair)}
.rules li{background:var(--band);padding:30px 28px 32px}
.rules .n{font-family:var(--latin);font-size:12px;font-weight:700;letter-spacing:.16em;
  color:var(--band-accent);margin:0 0 16px}
.rules h3{margin:0 0 10px;font-weight:700;font-size:20px;letter-spacing:-.03em;color:var(--band-ink);line-height:1.36}
.rules p:last-child{margin:0;color:var(--band-ink-2);font-size:14.5px;line-height:1.78}
@media(max-width:860px){.rules{grid-template-columns:1fr}}

.idcard{display:grid;grid-template-columns:minmax(0,.68fr) minmax(0,2fr);
  gap:clamp(24px,4vw,52px);align-items:center;border:1px solid var(--band-hair);padding:clamp(26px,3.6vw,44px)}
.idcard-art{background:var(--band-panel);aspect-ratio:1;display:grid;place-items:center;border-radius:2px}
.idcard-art .mark{--d:62%;color:var(--band-panel-ink)}
.idcard-spec{margin:0;display:flex;flex-direction:column;gap:0}
.idcard-spec>div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:20px;
  padding:18px 0;border-bottom:1px solid var(--band-hair)}
.idcard-spec>div:last-child{border-bottom:0;padding-bottom:0}
.idcard-spec>div:first-child{padding-top:0}
.idcard-spec dt{font-family:var(--latin);font-size:10.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--band-ink-3);padding-top:5px}
.idcard-spec dd{margin:0}
.idcard-spec dd b{display:block;font-weight:500;font-size:16.5px;color:var(--band-ink);letter-spacing:-.02em;margin-bottom:4px}
.idcard-spec dd span{display:block;font-size:14.5px;color:var(--band-ink-2);line-height:1.76}
@media(max-width:860px){.idcard{grid-template-columns:1fr}
  .idcard-art{aspect-ratio:16/7}.idcard-art .mark{--d:104px}
  .idcard-spec>div{grid-template-columns:1fr;gap:4px}
  .idcard-spec dt{padding-top:0}}

/* ══ 채널 두 장 ══ */
.more{border-top:1px solid var(--hair)}
.cards.two-up{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:860px){.cards.two-up{grid-template-columns:1fr}}

/* ══ 만든 사람 ══ 브랜드가 주인공이므로 이력은 요약만 두고 노션으로 보낸다 */
.who-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:clamp(30px,5vw,60px);align-items:start}
.who-stats{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.who-stats>div{padding:20px 0;border-bottom:1px solid var(--hair);
  display:grid;grid-template-columns:118px minmax(0,1fr);gap:20px;align-items:start}
.who-stats b{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,36px);
  line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.who-stats b span{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.who-stats p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.76}
@media(max-width:880px){.who-in{grid-template-columns:1fr}
  .who-stats>div{grid-template-columns:1fr;gap:6px}}

/* 글자수 세기는 이제 «만드는 것» 절 안에 들어간다 */
.work .mini{margin-top:clamp(26px,4vw,42px)}
.mini .label{font-family:var(--latin);font-size:10.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;display:flex;align-items:center;gap:9px}
.mini .label i{width:6px;height:6px;border-radius:50%;background:var(--yellow);flex:none}

footer{border-top:1px solid var(--hair);padding:34px 0 60px;background:var(--tint)}
footer .col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(24px,4vw,50px)}
footer p{margin:0;font-size:13px;color:var(--ink-3)}
footer .tagline{margin:14px 0 0;font-size:14px;color:var(--ink-2);max-width:26em;line-height:1.72}
.fnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.fnav h4{margin:0 0 12px;font-family:var(--latin);font-size:10.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.fnav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.fnav a{font-size:14px;color:var(--ink-2);text-decoration:none;
  display:flex;align-items:center;min-height:40px}
.fnav a:hover{color:var(--ink)}
footer .fine{grid-column:1 / -1;border-top:1px solid var(--hair);padding-top:20px;margin-top:8px;
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
@media(max-width:820px){footer .col{grid-template-columns:1fr}
  .fnav{grid-template-columns:repeat(2,minmax(0,1fr))}}
