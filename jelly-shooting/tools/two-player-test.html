<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>두 사람 왕복 검사</title>
<style>
  body{font:13px/1.6 ui-monospace,monospace;margin:0;padding:14px;background:#12141c;color:#e6e6ef;}
  h1{font-size:15px;margin:0 0 10px;}
  #log{white-space:pre-wrap;}
  .ok{color:#7ee08a;} .no{color:#ff8a9c;} .dim{color:#8a8aa0;}
  iframe{width:300px;height:520px;border:0;position:fixed;right:-9999px;}
</style></head>
<body>
<h1>젤리토 · 두 사람이 실제로 만나는지 검사 (가짜 서버 공유)</h1>
<div id="log">준비 중…</div>
<iframe id="A" src="../index.html"></iframe>
<iframe id="B" src="../index.html"></iframe>
<script>
// ────────────────────────────────────────────────────────────────
// 왜 이 검사가 필요한가.
// 실제 서버 없이도 "둘이 서로를 보는가"는 검사할 수 있다. broadcast와 presence를
// 두 인스턴스가 공유하는 가짜 클라이언트로 바꿔 끼우면, 인사(hello) 순서 경쟁·
// 방 등록 누락·랜덤 매칭 타이밍 같은 우리 쪽 논리 버그가 그대로 드러난다.
// (서버 설정 문제는 이걸로 알 수 없다 — 그건 배포된 주소에서 확인해야 한다)
// ────────────────────────────────────────────────────────────────
const LOG=document.getElementById('log'); let lines=[], fails=0;
const say=(m,c)=>{ lines.push(c?`<span class="${c}">${m}</span>`:m); LOG.innerHTML=lines.join('\n'); };
const ok  =m=>say('✅ '+m,'ok');
const no  =m=>{ fails++; say('❌ '+m,'no'); };
const dim =m=>say('   '+m,'dim');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ── 가짜 서버 (broadcast + presence 공유) ──
const BUS={ ch:{}, drop:0 };   // drop>0 이면 그만큼의 broadcast를 삼킨다(유실 재현)
BUS.sync=name=>(BUS.ch[name]||[]).forEach(o=>o.presH.forEach(h=>h({event:'sync'})));
function fakeClient(){
  return {
    channel(name){
      const ch={ name, msgH:[], presH:[], presence:null,
        on(type,f,cb){ (type==='broadcast'?ch.msgH:ch.presH).push(cb); return ch; },
        subscribe(cb){ (BUS.ch[name]=BUS.ch[name]||[]).push(ch);
          setTimeout(()=>{ if(cb)cb('SUBSCRIBED'); BUS.sync(name); },12); return ch; },
        // 보낸 사람에게는 되돌려주지 않는다(supabase 기본값과 같게)
        send(msg){ if(BUS.drop>0){ BUS.drop--; return Promise.resolve('ok'); }   // 삼킨다
          setTimeout(()=>{ (BUS.ch[name]||[]).forEach(o=>{ if(o!==ch) o.msgH.forEach(h=>h(msg)); }); },6);
          return Promise.resolve('ok'); },
        track(o){ ch.presence=o; setTimeout(()=>BUS.sync(name),6); return Promise.resolve('ok'); },
        untrack(){ ch.presence=null; setTimeout(()=>BUS.sync(name),6); return Promise.resolve('ok'); },
        presenceState(){ const st={};
          (BUS.ch[name]||[]).forEach((o,i)=>{ if(o.presence) st['k'+i]=[o.presence]; }); return st; },
      };
      return ch;
    },
    removeChannel(ch){ const a=BUS.ch[ch&&ch.name]||[]; const i=a.indexOf(ch);
      if(i>=0)a.splice(i,1); if(ch&&ch.name)BUS.sync(ch.name); },
    from(){ const q={ select:()=>q, eq:()=>q, order:()=>q,
      limit:()=>Promise.resolve({data:[],error:null}), insert:()=>Promise.resolve({error:null}),
      update:()=>q, maybeSingle:()=>Promise.resolve({data:null,error:null}) }; return q; },
  };
}

const A=document.getElementById('A'), B=document.getElementById('B');
const w=f=>f.contentWindow;
// 게임의 최상위 let/const 는 window 속성이 아니다(그래서 WA.net 이 undefined였다).
// 프레임 안에서 eval 하면 그 창의 전역 렉시컬 환경이 그대로 보인다.
const ev=(f,code)=>w(f).eval(code);
function install(f,nick){
  const W=w(f);
  W.supabase={createClient:()=>window.parent.__fakeClient()};
  ev(f,'_supa=null');                 // 다음 getSupa()에서 가짜로 다시 만들게
  ev(f,'supaReady=()=>true');
  ev(f,'hubLeave(); netLeave(); aiStop();');
  W.saveNick(nick);
}
window.__fakeClient=fakeClient;
const wait=async(cond,ms=4000)=>{ const t0=Date.now();
  while(Date.now()-t0<ms){ if(cond())return true; await sleep(60); } return false; };

async function run(){
  // about:blank도 'complete'라서 load 이벤트로 판단하면 안 된다(그래서 한 번 헛돌았다).
  // 게임 함수가 실제로 올라올 때까지 기다린다.
  const ready=f=>{ try{ return typeof w(f).saveNick==='function' && typeof w(f).netCreate==='function'; }catch(e){ return false; } };
  const both=await wait(()=>ready(A)&&ready(B),15000);
  if(!both){ no('게임 인스턴스를 불러오지 못했습니다'); window.__done=true; window.__fails=1; return; }
  await sleep(300);
  lines=[]; say('두 인스턴스 로드 완료','dim');

  // ── 1. 방 만들기 → 코드로 입장 (정상 순서) ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  await sleep(60);
  ev(A,'netCreate()');
  const code=ev(A,'net.room');
  if(!code||code.length!==6) no('방 코드가 안 만들어졌다: '+code); else ok('방 코드 '+code+' 생성');
  await sleep(200);
  ev(B,'$("netCodeInput").value='+JSON.stringify(code)+'; netJoinByCode();');
  const bothMet=()=>ev(A,'!!net.foe')&&ev(B,'!!net.foe');
  let met=await wait(bothMet);
  if(met) ok('서로 인사 완료 — A가 본 상대 "'+ev(A,'net.foe.name')+'", B가 본 상대 "'+ev(B,'net.foe.name')+'"');
  else no('서로를 못 봤다 (A '+(ev(A,'!!net.foe')?'O':'X')+' / B '+(ev(B,'!!net.foe')?'O':'X')+')');

  // ── 2. 들어온 쪽이 먼저 구독하는 순서 (예전에 여기서 서로 못 봤다) ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  const code2='ZZTEST';
  ev(B,'netEnterRoom("'+code2+'",false)');          // 손님이 먼저 들어가서 인사를 던진다
  await sleep(500);                       // 방장은 아직 없다 → 그 인사는 사라진다
  ev(A,'netEnterRoom("'+code2+'",true)');            // 방장이 뒤늦게 들어온다
  met=await wait(bothMet,6000);
  if(met) ok('손님이 먼저 들어와도 만난다 (인사 반복 덕분)');
  else no('손님이 먼저 들어오면 서로 못 본다');

  // ── 3. 공개 방 목록 (방장이 목록에 뜨는가) ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('throw')"); ev(B,"openNetMode('throw')");
  await sleep(700);                        // 로비가 먼저 붙는다 — 실제로도 이 순서다
  ev(A,'netPublic=true; netCreate();');
  const hostRoom0=ev(A,'net.room');
  const seen=await wait(()=>ev(B,'hubRooms.some(r=>r.room==="'+hostRoom0+'")'),4000);
  if(seen){ ok('B의 목록에 A의 방이 보인다 ('+hostRoom0+')');
    const rows=w(B).document.querySelectorAll('#roomList .roomrow');
    if(rows.length) ok('목록에 입장 버튼 '+rows.length+'개 그려짐');
    else no('hubRooms엔 있는데 화면에 안 그려졌다');
  } else no('B의 목록에 A의 방이 안 보인다');

  // ── 4. 목록에서 눌러 입장 ──
  const row=w(B).document.querySelector('#roomList .roomrow');
  if(row){ row.click();
    met=await wait(bothMet,5000);
    if(met) ok('목록에서 눌러 입장 → 서로 인사 완료');
    else no('목록에서 눌렀는데 만나지 못했다');
  }

  // ── 5. 랜덤 매칭이 열린 방으로 들어가는가 (새 방을 열면 실패) ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  await sleep(700);                        // 로비가 먼저 붙는다
  ev(A,'netPublic=true; netCreate();');
  const hostRoom=ev(A,'net.room');
  await wait(()=>ev(B,'hubRooms.some(r=>r.room==="'+hostRoom+'")'),4000);
  ev(B,'netRandom()');
  const joined=await wait(()=>ev(B,'net.room')===hostRoom,6000);
  if(joined) ok('랜덤 매칭이 열린 방('+hostRoom+')으로 들어갔다');
  else no('랜덤 매칭이 남의 방을 못 찾고 '+(ev(B,'net.room')?('새 방 '+ev(B,'net.room')+'을 열었다'):'아무것도 안 했다'));
  met=await wait(bothMet,5000);
  if(met) ok('랜덤 매칭 뒤 서로 인사 완료');
  else no('랜덤 매칭 뒤 서로를 못 봤다');

  // ── 5-b. 첫 인사가 유실돼도 만나는가 (모바일에서 흔하다) ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  await sleep(200);
  BUS.drop=3;                              // 처음 세 통을 삼킨다
  ev(A,'netCreate()'); await sleep(120);
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  met=await wait(bothMet,8000);
  BUS.drop=0;
  if(met) ok('첫 인사 3통이 유실돼도 만난다');
  else no('인사가 한 번 유실되면 서로 못 본다');

  // ── 5-c. 방장이 고른 난이도·역할이 손님에게 그대로 가는가 ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('throw')"); ev(B,"openNetMode('throw')");
  await sleep(120);
  ev(A,"netModeName='fire'; hostRole='popper'; netCreate();");
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  await wait(bothMet,5000);
  await sleep(400);
  const gm=ev(B,'netModeName'), gr=ev(B,'hostRole'), gs=ev(B,'net.timeLimit');
  if(gm==='fire') ok('방장이 고른 난이도(핵불닭)가 손님에게 전달됐다');
  else no('난이도가 전달되지 않았다: 손님은 '+gm);
  if(gr==='popper') ok('방장 역할(터트리는 사람)이 전달돼 손님은 반대 역할이 된다 (손님 역할 '+ev(B,'(computeRole(),myRole)')+')');
  else no('역할이 전달되지 않았다: '+gr);
  if(gs===90) ok('던지기 게임 제한시간 90초 전달');
  else no('제한시간이 틀렸다: '+gs);

  // ── 6. 링크를 코드 칸에 붙여넣어도 되는가 ──
  const cases=[['abc123','ABC123'],[' ab-c1 23 ','ABC123'],
    ['https://x.y/?r=ABC123','ABC123'],['https://x.y/index.html?r=abc123#z','ABC123']];
  let bad=0;
  cases.forEach(([raw,want])=>{ const got=ev(B,'parseRoomCode('+JSON.stringify(raw)+')'); if(got!==want){ bad++; dim('  "'+raw+'" → '+got+' (기대 '+want+')'); } });
  if(bad) no('코드 해석 '+bad+'건 실패'); else ok('소문자·공백·하이픈·링크 붙여넣기 모두 해석');

  // ── 6.5 대기실에서 서로의 얼굴이 보이는가 ──
  // 이름만 오가고 차림새는 안 오는 일이 있었다(나만의 악세서리를 id 로만 보내서
  // 받는 쪽이 못 찾고 맨머리로 그렸다). 사진이 '내 얼굴'로 대체되는 것도 통과가 아니다 —
  // 두 사람 사진이 서로 달라야 진짜 상대 얼굴이다.
  install(A,'까미'); install(B,'하늘');
  // 서로 다른 차림새를 준다. B 는 나만의 악세서리까지 씌운다(가장 잘 새던 곳).
  ev(A,"character={kind:'girl',color:'#ffb3c9',acc:'bow',accColor:'#ff5c8a',hair:'braid'}");
  ev(B,"customAccs.length=0; customAccs.push({id:'ca_q',label:'별',emoji:'⭐',color:'#8a5cff'});"
      +"character={kind:'bear',color:'#c9a27a',acc:'ca_q',accColor:'#8a5cff',hair:'basic'}");
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  ev(A,'netCreate()'); await sleep(150);
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  await wait(bothMet,5000);
  await wait(()=>ev(A,'!!peerChar(peerList()[0].id)'),3000);
  ev(A,'renderLobby()');
  const rows=ev(A,"[...$('lobbyPlayers').querySelectorAll('img.ava')].map(i=>i.src)");
  const got=ev(A,'JSON.stringify(peerChar(peerList()[0].id))');
  const want=ev(B,'JSON.stringify(charSafe(charPack()))');
  if(rows.length<2) no('대기실에 사진이 '+rows.length+'개뿐이다 (내 것 + 상대 것 = 2개여야 한다)');
  else if(rows[0]===rows[1]) no('두 사람 사진이 똑같다 — 상대 얼굴이 아니라 내 얼굴을 두 번 그렸다');
  else if(got!==want) no('상대 차림새가 어긋난다: 받은 것 '+got+' / 보낸 것 '+want);
  else if(ev(A,"peerChar(peerList()[0].id).hair")!=='basic') no('상대 머리 모양이 어긋난다');
  else if(JSON.parse(want).hair!=='basic') no('보낸 꾸러미에 머리 모양이 없다');
  else ok('대기실에서 서로 다른 얼굴이 보인다 (나만의 악세서리 ⭐·머리 모양까지 전달: '+got+')');
  // 내가 산 머리 모양(땋은머리)도 상대에게 그대로 가야 한다
  ev(B,'renderLobby()');
  const aHair=ev(B,"(peerList().map(p=>peerChar(p.id)).filter(Boolean)[0]||{}).hair");
  if(aHair!=='braid') no('상대의 땋은머리가 전달되지 않았다 (받은 값 '+aHair+')');
  else ok('머리 모양이 상대 화면에도 그대로 (까미 = 땋은머리)');

  // ── 6.7 방 채팅이 실제로 오가는가 ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  ev(A,'netCreate()'); await sleep(150);
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  await wait(bothMet,5000);
  ev(A,'$("roomChatInput").value="안녕 하늘아"; roomChatSay();');
  const gotB=await wait(()=>ev(B,'roomMsgs.some(m=>m.text==="안녕 하늘아")'),3000);
  ev(B,'$("roomChatInput").value="ㅎㅇ 까미"; roomChatSay();');
  const gotA=await wait(()=>ev(A,'roomMsgs.some(m=>m.text==="ㅎㅇ 까미")'),3000);
  if(!gotB) no('A가 보낸 방 채팅이 B에게 안 갔다');
  else if(!gotA) no('B가 보낸 방 채팅이 A에게 안 갔다');
  else {
    // 보낸 쪽에도 남아야 한다 (broadcast 는 보낸 사람에게 되돌아오지 않는다)
    const mineA=ev(A,'roomMsgs.filter(m=>m.name==="까미").length');
    const nameB=ev(B,'roomMsgs.find(m=>m.text==="안녕 하늘아").name');
    const avaB=ev(B,'!!(roomMsgs.find(m=>m.text==="안녕 하늘아").ch)');
    if(!mineA) no('보낸 쪽 화면에 내 말이 안 남았다');
    else if(nameB!=='까미') no('보낸 사람 이름이 틀렸다: '+nameB);
    else if(!avaB) no('채팅에 차림새(프로필 사진)가 안 실렸다');
    else ok('방 채팅 왕복 + 보낸 쪽에도 남음 + 프로필 사진 실림 (B가 본 이름 "'+nameB+'")');
  }
  // 도배 막기 · 길이 자르기 · 빈 말
  const before=ev(A,'roomMsgs.length');
  ev(A,'chatLast=0; $("roomChatInput").value="도배1"; roomChatSay(); $("roomChatInput").value="도배2"; roomChatSay();');
  const after=ev(A,'roomMsgs.length');
  if(after-before!==1) no('도배가 안 막혔다 ('+(after-before)+'개 들어감)');
  else ok('연달아 보내면 한 개만 나간다 (도배 막기)');
  ev(A,'chatLast=0; $("roomChatInput").value="'+'가'.repeat(90)+'"; roomChatSay();');
  const len=ev(A,'roomMsgs[roomMsgs.length-1].text.length');
  if(len!==60) no('길이를 60자로 안 잘랐다: '+len);
  else ok('90자를 보내면 60자로 자른다');
  ev(A,'chatLast=0;');
  const b2=ev(A,'roomMsgs.length');
  ev(A,'$("roomChatInput").value="   "; roomChatSay();');
  if(ev(A,'roomMsgs.length')!==b2) no('빈 말이 나갔다');
  else ok('빈 말·공백만은 안 나간다');
  // 제어문자·줄바꿈 제거
  ev(A,'chatLast=0; $("roomChatInput").value="한"+String.fromCharCode(0)+"줄"+String.fromCharCode(10)+"바꿈"; roomChatSay();');
  const cl=ev(A,'roomMsgs[roomMsgs.length-1].text');
  if(/[\u0000-\u001f]/.test(cl)) no('제어문자가 그대로 들어갔다: '+JSON.stringify(cl));
  else ok('제어문자·줄바꿈은 지운다 ("'+cl+'")');

  // ── 6.8 메시지 회수 ──
  ev(A,'chatLast=0; $("roomChatInput").value="이건 회수할 말"; roomChatSay();');
  const gotIt=await wait(()=>ev(B,'roomMsgs.some(m=>m.text==="이건 회수할 말")'),3000);
  if(!gotIt) no('회수 검사를 위한 메시지가 안 갔다');
  else {
    const mid=ev(A,'roomMsgs[roomMsgs.length-1].id');
    ev(A,'chatUnsend('+JSON.stringify(mid)+',false)');
    if(ev(A,'roomMsgs.some(m=>m.id==='+JSON.stringify(mid)+')')) no('내 화면에서 안 지워졌다');
    else {
      const goneB=await wait(()=>!ev(B,'roomMsgs.some(m=>m.text==="이건 회수할 말")'),3000);
      if(!goneB) no('상대 화면에서 안 지워졌다');
      else ok('메시지 회수 — 내 화면·상대 화면 양쪽에서 사라진다');
    }
  }
  // 남의 말은 회수할 수 없다
  ev(B,'chatLast=0; $("roomChatInput").value="하늘이 말"; roomChatSay();');
  await wait(()=>ev(A,'roomMsgs.some(m=>m.text==="하늘이 말")'),3000);
  const foeId=ev(A,'(roomMsgs.find(m=>m.text==="하늘이 말")||{}).id');
  ev(A,'chatUnsend('+JSON.stringify(foeId)+',false)');
  if(!ev(A,'roomMsgs.some(m=>m.text==="하늘이 말")')) no('남의 말을 회수해 버렸다');
  else ok('남의 말은 회수되지 않는다');
  // 이름이 다르면 지우라는 말도 안 듣는다 (아무나 남의 말을 지우지 못하게)
  const mineId=ev(B,'(roomMsgs.find(m=>m.text==="하늘이 말")||{}).id');
  ev(A,'netSend({t:"unsay",id:'+JSON.stringify(mineId)+',name:"까미"})');
  await sleep(400);
  if(!ev(B,'roomMsgs.some(m=>m.text==="하늘이 말")')) no('이름이 달라도 지워졌다');
  else ok('보낸 사람 이름이 다르면 지우라는 말을 무시한다');

  // ── 6.9 한 판 하고 그 친구랑 바로 다시 ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  ev(A,'netCreate()'); await sleep(150);
  const rmRoom=ev(A,'net.room');
  ev(B,'netEnterRoom("'+rmRoom+'",false)');
  await wait(bothMet,5000);
  // 판을 한 번 치른 것처럼 만든다
  ev(A,'net.ready=true; net.playedOnce=true; netMode=true; net.myOver=true; net.order=[myId];');
  ev(B,'net.ready=true; net.playedOnce=true; netMode=true;');
  ev(A,"lastPlay={kind:'online',game:'dungeon',role:'popper'}; showScreen('overScreen'); syncAgainBtn();");
  const label=ev(A,'$("againBtn").textContent');
  if(label.indexOf('하늘')<0) no('다시 하기 버튼에 친구 이름이 안 나온다: '+label);
  else ok('결과 화면 버튼이 "'+label+'" 로 바뀐다 (방을 다시 팔 필요 없음)');
  ev(A,'playAgain()');
  await sleep(300);
  const aLobby=ev(A,'!$("lobbyScreen").classList.contains("hide")');
  const sameRoom=ev(A,'net.room')===rmRoom;
  const bLobby=await wait(()=>ev(B,'!$("lobbyScreen").classList.contains("hide")'),3000);
  if(!aLobby) no('다시 하기를 눌렀는데 대기실로 안 갔다');
  else if(!sameRoom) no('방이 바뀌었다 (같은 방이어야 한다): '+ev(A,'net.room'));
  else if(!bLobby) no('상대가 대기실로 안 따라왔다');
  else {
    const cleared=ev(A,'!net.ready && !net.myOver && net.order.length===0 && peerList().every(p=>!p.ready)');
    if(!cleared) no('준비·탈락 상태가 안 비워졌다');
    else ok('같은 방('+rmRoom+')에서 둘 다 대기실로 — 준비·점수·탈락 순서 초기화');
  }
  ev(A,'netLeave()'); ev(B,'netLeave()');

  // ── 6-b. 🔄 던지기 게임 역할 바꾸기 (대기실에서 바로) ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('throw'); hostRole='thrower';"); ev(B,"openNetMode('throw')");
  ev(A,'netCreate()'); await sleep(150);
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  await wait(bothMet,5000);
  ev(A,'openLobby()'); ev(B,'openLobby()'); await sleep(200);
  const roleA0=ev(A,'myRole'), roleB0=ev(B,'myRole');
  if(roleA0!==roleB0) ok('처음 역할 — A '+roleA0+' / B '+roleB0);
  else no('둘이 같은 역할이다 ('+roleA0+')');
  // 둘 다 준비해 둔 상태에서 바꿔 본다 (준비가 풀려야 한다).
  // lobbyReady() 를 쓰면 둘 다 준비되어 판이 바로 시작되므로(던지기 게임) 상태만 세운다.
  ev(A,'net.ready=true; peerList().forEach(p=>p.ready=true); renderLobby()');
  ev(B,'net.ready=true; peerList().forEach(p=>p.ready=true); renderLobby()');
  await sleep(150);
  const swapVisible=ev(A,'!$("lobbySwapBtn").classList.contains("hide")');
  if(swapVisible) ok('대기실에 역할 바꾸기 단추가 보인다 ("'+ev(A,'$("lobbySwapBtn").textContent').trim()+'")');
  else no('역할 바꾸기 단추가 안 보인다');
  ev(A,'$("lobbySwapBtn").click()');
  const flipped=await wait(()=>ev(B,'myRole')!==roleB0,3000);
  const roleA1=ev(A,'myRole'), roleB1=ev(B,'myRole');
  if(flipped&&roleA1===roleB0&&roleB1===roleA0) ok('A가 누르자 둘 다 역할이 맞바뀌었다 (A '+roleA1+' / B '+roleB1+')');
  else no('역할이 안 바뀌었다 (A '+roleA1+' / B '+roleB1+')');
  const cleared=ev(A,'!net.ready')&&ev(B,'!net.ready');
  if(cleared) ok('바꾸면 준비 상태가 풀린다 (바뀐 역할로 갑자기 시작하지 않게)');
  else no('준비 상태가 그대로다 (A '+ev(A,'net.ready')+' / B '+ev(B,'net.ready')+')');
  // 손님(B)이 눌러도 바뀐다
  ev(B,'$("lobbySwapBtn").click()');
  const back=await wait(()=>ev(A,'myRole')===roleA0,3000);
  if(back) ok('손님이 눌러도 바뀐다 (A '+ev(A,'myRole')+' / B '+ev(B,'myRole')+')');
  else no('손님이 누르면 안 바뀐다');
  ev(A,'netLeave()'); ev(B,'netLeave()');

  // ── 7. 👀 관전 — 탈락한 A가 아직 하는 B의 화면을 본다 ──
  // 가짜 서버로 실제 broadcast 를 왕복시킨다. 여기서 걸리면 폰에서도 안 보인다.
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  ev(A,'netCreate()'); await sleep(150);
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  await wait(bothMet,5000);
  // B의 얼굴을 확실히 정해 둔다 (관전 화면에 이 얼굴이 그려져야 한다)
  ev(B,"character.kind='bear'; character.color='#c9a27a'; saveChar(); netSend({t:'hi',name:'하늘',char:charPack()});");
  await sleep(150);
  // A는 탈락해서 결과 화면으로, B는 계속 플레이 중
  ev(A,"netMode=false; netGame='dungeon'; net.mp=true; net.myOver=true; net.myScore=100;"
      +"net.myReason='dead'; net.order=[myId];"
      +"lastPlay={kind:'online',game:'dungeon',role:'popper'};"
      +"showScreen('overScreen'); netSend({t:'over',score:100,reason:'dead'}); netResolve();");
  await sleep(250);
  const cardOn=ev(A,'!$("watchCard").classList.contains("hide")');
  if(cardOn) ok('탈락한 A에게 관전 칸이 떴다 (보는 사람: '+ev(A,'(net.peers[watch.id]||{}).name')+')');
  else no('탈락했는데 관전 칸이 안 뜬다');
  // B가 자기 판을 보낸다 — 실제 경로(update 안에서 watchers() 가 참일 때)를 그대로 탄다
  const bKnew=ev(B,"(()=>{ netMode=true; netGame='dungeon'; running=true; lives=5; net.timeLimit=999;"
    +"jellies.length=0; for(let i=0;i<6;i++) jellies.push({x:60+i*60,y:100+i*60,r:28,vx:0,vy:1,"
    +"color:'#ff5c8a',bomb:false,gold:false,ghost:false,face:'happy',shape:'round',wob:0,pts:10,dead:false});"
    +"const has=watchers(); elapsed=9; update(); running=false; netMode=false; return has; })()");
  if(!bKnew) no('B가 "볼 사람이 생겼다"를 못 알아챈다 (그러면 화면을 안 보낸다)');
  const gotView=await wait(()=>ev(A,'!!(net.peers[watch.id]&&net.peers[watch.id].view)'),3000);
  if(!gotView) no('B의 화면이 A에게 오지 않았다');
  else {
    const n=ev(A,'net.peers[watch.id].view.j.length');
    ev(A,'watchDraw()');
    const ink=ev(A,"(()=>{ const c=$('watchCanvas'),g=c.getContext('2d');"
      +"const d=g.getImageData(0,0,c.width,c.height).data; let n=0;"
      +"for(let i=0;i<d.length;i+=4) if(d[i+3]>200&&(d[i]>200&&d[i+1]<170)) n++; return n; })()");
    const info=ev(A,'$("watchInfo").textContent');
    if(n<6) no('받은 젤리 수가 모자라다: '+n);
    else if(ink<200) no('관전 화면에 B의 젤리가 안 그려졌다 (분홍 화소 '+ink+')');
    else if(info.indexOf('하늘')<0) no('누구를 보는지 안 적혔다: '+info);
    else ok('B의 판이 A 화면에 그려졌다 (젤리 '+n+'개 · 분홍 '+ink+'화소 · "'+info.trim()+'")');
  }
  // B도 끝나면 관전 칸이 사라지고 결과 그림이 뜬다
  ev(B,"net.myOver=true; net.myScore=900; net.myReason='time';"
      +"lastPlay={kind:'online',game:'dungeon',role:'thrower'};"
      +"netSend({t:'over',score:900,reason:'time'}); showScreen('overScreen'); netResolve();");
  await sleep(300);
  const closed=await wait(()=>ev(A,'$("watchCard").classList.contains("hide")'),3000);
  const shown=ev(A,'!$("celebCanvas").classList.contains("hide")');
  const mine=ev(A,'lastBattle&&lastBattle.mine');
  const foeKind=ev(A,'lastBattle&&lastBattle.win.ch.kind');
  if(!closed) no('B도 끝났는데 관전 칸이 남아 있다');
  else if(!shown) no('결과가 정해졌는데 승패 그림이 안 뜬다');
  else if(mine!=='lose') no('A는 탈락했는데 결과가 '+mine);
  else if(foeKind!=='bear') no('이긴 쪽 얼굴이 B가 고른 얼굴이 아니다: '+foeKind);
  else ok('B도 끝나자 관전이 닫히고, A에게 "졌다" 그림이 뜬다 (이긴 얼굴 '+foeKind+')');
  // 💬 말풍선을 고르면 상대 화면의 내 말풍선도 바로 바뀐다
  const aChips=ev(A,'$("sayRow").childElementCount');
  const aMine=ev(A,'mySide()');
  if(aChips>0&&aMine==='lose') ok('진 A 에게 말풍선 칩 '+aChips+'개 (진 사람 말)');
  else no('말풍선 칩이 안 떴다 (칩='+aChips+' 자리='+aMine+')');
  ev(A,'$("sayRow").children[1].click()');
  const said=ev(A,'lastBattle.lose.say');
  const heard=await wait(()=>ev(B,'lastBattle&&lastBattle.win&&lastBattle.win.say')===said
                         ||ev(B,'lastBattle&&lastBattle.lose&&lastBattle.lose.say')===said,3000);
  const bSide=ev(B,'lastBattle&&lastBattle.lose&&lastBattle.lose.say');
  if(heard&&bSide===said) ok('A가 고른 말("'+said+'")이 B 화면의 A 말풍선에 그대로 떴다');
  else no('말풍선이 상대에게 안 갔다 (A "'+said+'" / B "'+bSide+'")');
  // B(이긴 쪽)가 고른 말은 B 자리에만 들어간다
  const bChips=ev(B,'$("sayRow").childElementCount');
  ev(B,'$("sayRow").children[0].click()');
  const bSaid=ev(B,'lastBattle.win.say');
  const aHeard=await wait(()=>ev(A,'lastBattle.win.say')===bSaid,3000);
  if(bChips>0&&aHeard) ok('B가 고른 말("'+bSaid+'")도 A 화면에 떴다 (칩 '+bChips+'개)');
  else no('이긴 쪽 말풍선이 안 갔다 (B "'+bSaid+'" / A "'+ev(A,'lastBattle.win.say')+'")');
  ev(A,'netLeave()'); ev(B,'netLeave()');

  // ── 7. 한 쪽이 나가면 상대가 안다 ──
  install(A,'까미'); install(B,'하늘');
  ev(A,"openNetMode('dungeon')"); ev(B,"openNetMode('dungeon')");
  ev(A,'netCreate()'); await sleep(150);
  ev(B,'netEnterRoom("'+ev(A,'net.room')+'",false)');
  await wait(bothMet,5000);
  ev(B,'netLeave()');
  const gone=await wait(()=>ev(A,'net.foeGone===true'),3000);
  if(gone) ok('상대가 나가면 바로 안다 (bye 전달)');
  else no('상대가 나갔는데 모른다');

  say('');
  say(fails? ('총 '+fails+'건 실패') : '전부 통과', fails?'no':'ok');
  window.__done=true; window.__fails=fails;
}
run().catch(e=>{ no('검사 중 오류: '+(e&&e.message||e)); window.__done=true; window.__fails=99; });
</script>
</body></html>
